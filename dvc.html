<!--
  DVC — real screen. Visual truth: Figma DVC section 25:511, read via
  figwright 2026-07-25 (geometry pass: every padding/gap/size/radius/stroke
  below is a literal auto-layout value from the frame reads, not an estimate).
  Spec: specs/DVC-SPEC.md · schema: DATA-MODEL.md §5b · logic: js/dvc.js.

  Frame logic (Active Frame = 375×726, Footer 85.8, page 375×812):
    01 Zero     pad 20        gap 40  primary CENTER  counter CENTER
    02 SetUp    pad 32/20/16  gap 16  primary CENTER  counter CENTER
    03/03a/04/04a/05
                pad 32/20/16  gap 16  primary MIN     counter CENTER
  Content column is 335 (375 − 20 − 20) everywhere.

  Vectors are exact Figma SVG exports (the sanctioned export under the Token
  Economy rule): the settings glyph is a FOUR-POINT SPARKLE closing a stack of
  three rules — not a circle; the 01 hero is the two-line "WELCOME HOME"
  wordmark as outlined type; each Contract Info row carries a circled-X remove
  control; the Points Used row carries a filled pencil badge.

  Text boxes use `text-box: trim-both cap alphabetic` so element heights equal
  Figma's cap-height boxes (SemiBold 19 → 14px, Regular 15 → 11px, Bold 23 →
  17px …), the same translation law established by the Spend build.

  Numbers are typed directly — inputmode="numeric" text fields, never
  <input type="number"> (no spinner/scroll buttons anywhere).

  Board-vs-spec drift applied per "spec follows board": Track Annual Dues is a
  Yes/No text toggle (not a checkbox); reconcile CTA reads RECONCILE. "CANCLE"
  is a spelling typo on the board and ships as CANCEL.

  CTA grammar settled 2026-07-27 (the design director): every points-logging CTA reads
  LOG POINTS — the bare LOG is retired. RECONCILE stays as drawn. The card
  title is Points Reconciliation, renamed from Contract Reconciliation.
  ✅ BOARD RE-READ 2026-07-27 via figwright: node 57:2222 carries LOG POINTS
  at width 146 (HUG = 24 + 98 label + 24), and the section text nodes show
  six LOG POINTS, zero bare LOG, plus "Points Reconciliation". Board and
  build agree — nothing pending in Figma for either change.
-->
<html lang="en">
<head>

<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

<!-- iOS is the platform this matters on. Safari evicts IndexedDB after 7 days
     without a visit, and a Home Screen app is exempt — so these tags are not
     polish, they are what stops a tester losing their ledger by not opening
     the app for a week. `apple-mobile-web-app-capable` is still required:
     iOS only began honouring the manifest's display mode in 16.4. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<meta name="theme-color" content="#DE2C47" />
<!-- No webfont <link>: Manrope and 42dot Sans are self-hosted in css/theme.css
     (the design director, 2026-08-02), so the app makes no third-party request at all. -->
<link rel="stylesheet" href="css/theme.css">
<!-- classic + blocking on purpose: sets <html data-theme> before first paint -->
<script src="js/theme.js"></script>
<style>
/* ══ Theme tokens live in css/theme.css — ONE copy for all five screens ══ */

/* ══ Structural tokens — Figma variables, values verified in the frame reads ══ */
:root {
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --surface-overlay: #FFFFFF8C;       /* color/Surface-Overlay — points-usage card */
  --radius-card: 14px;                /* radius/card */
  --radius-compact-card: 12px;        /* radius/compact-card — points-usage */
  --radius-input: 10px;               /* radius/input */
  --radius-field: 8.035714px;         /* Contract Info / trip box (unbound on board) */
  --radius-points: 7px;               /* Points box, 05 allocation */
  --radius-pill: 16px;                /* year pill */
  --space-1: 8px; --space-3: 16px; --space-4: 24px;
  --cta-h: 48px;                      /* size/cta-height */
  --border-default: 1px;              /* border/default */
  --border-strong: 1.5px;             /* border/strong */
  --stroke-field: 1.2053571px;        /* Contract Info inner boxes */
  --stroke-card: 0.8035714px;         /* no-trop / log-points card outline */
  --footer-h: 85.802238px;
  --disabled: 0.5;                    /* opacity/disabled */
  --shadow-card: 0 1px 3px rgba(30,30,30,0.10);
  --ink-deep: #063E66;                /* raw on board — trip/placeholder copy */
  --card-stroke: #FFEEA4;             /* raw on board — active-card outline */
  --col: 335px;                       /* content column */
}

/* ══ Base ══ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
/* ══ The app frame (the design director, 2026-07-27) ══════════════════════════════════
   The five screens used to disagree above 375px: Home and Trips pinned their
   content left (states positioned at literal board coordinates), while Spend,
   DVC and Insights centred theirs. the design director chose centred for all.

   The whole frame is capped and centred — content AND footer together — so a
   wide window shows one phone-width column, not a narrow column sitting on a
   full-width bar. html carries the page colour so the margins match.

   At 375 and below this is completely inert, which is why it changes no
   audited pixel: 375 is the drawn width and the QA viewport.

   Home and Trips keep literal board coordinates INSIDE the frame — those are
   the drawn Figma values, and re-expressing them as flex gaps would mean
   inventing spacing nobody drew. Centring the frame achieves the chosen
   behaviour without touching them. */
html { background: var(--dvc-bg); }
body { font-family: var(--font); background: var(--dvc-bg); color: var(--ink);
  width: 100%;
  display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; background: none; border: 0; cursor: pointer; color: inherit; }
input, select { font: inherit; color: inherit; }
/* Figma cap-height vertical trim — makes element heights equal Figma's boxes */
.txt { text-box: trim-both cap alphabetic; }

/* ══ Text styles — Figma text styles, verbatim ══ */
.t-h1   { font-weight: 700; font-size: 23px; line-height: 145%; }  /* text_1thrppw */
.t-h3   { font-weight: 600; font-size: 19px; line-height: 135%; }  /* text_zt8bqg  */
.t-cta  { font-weight: 600; font-size: 17px; line-height: 120%; }  /* text_10ind90 */
.t-17   { font-weight: 400; font-size: 17px; line-height: 120%; }  /* text_1f5ioj9 */
.t-15b  { font-weight: 600; font-size: 15px; line-height: 120%; }  /* text_6dw2sm  */
.t-15   { font-weight: 400; font-size: 15px; line-height: 120%; }  /* text_1w8fsoj */
.t-12   { font-weight: 400; font-size: 12px; line-height: 120%; }  /* text_k3kfra  */
.t-12u  { font-weight: 400; font-size: 12px; line-height: 120%; text-decoration: underline; } /* text_1aecybr */
.t-13   { font-weight: 600; font-size: 13px; line-height: 120%; }  /* text_7izqjk — footer */

/* ══ Active Frame ══ */
/* The app column is 375 and the FOOTER BAND is not (the design director 2026-08-01,
   option 1). The constraint used to sit on `body`, so the white band ended
   with the app: at any window wider than 375 the column centred and theme
   background showed on BOTH sides of the band, which read as the footer
   stopping short. The column now lives on `main`, and `body` is free to be as
   wide as the window — so the band spans it while the five 75px tabs stay
   centred on 375 by the footer's own `justify-content: center`.
   Nothing drawn moves: `main` is the positioned ancestor on Home and Trips,
   so every absolute coordinate inside it is unchanged. */
/* overflow-x restored 2026-08-01. Moving the 375 column from `body` to `main`
   also moved the CLIP: `body { overflow: hidden }` used to crop everything to
   375, and with `body` now as wide as the window that guard was silently gone,
   so anything overflowing this column could paint into the side gutters.
   `clip`, not `hidden`, because these mains scroll vertically and `hidden`
   would make this box a scroll container on both axes. */
main { flex: 1; overflow-y: auto; overflow-x: clip; display: flex; flex-direction: column;
  width: 100%; max-width: 375px; margin-inline: auto; }
.state { display: none; min-height: 100%; flex-direction: column; }
.state.on { display: flex; }
.frame-zero  { padding: 20px;             gap: 40px; align-items: center; justify-content: center; }
.frame-setup { padding: 32px 20px 16px;   gap: 16px; align-items: center; justify-content: center; }
.frame-active{ padding: 32px 20px 16px;   gap: 16px; align-items: center; }
.state > * { width: var(--col); flex: none; }

/* ══ 01 Zero ══ */
.hero { width: 277.456px; height: 105.655px; }
.zero-copy { width: 319px; text-align: center; color: var(--dvc-primary); }

/* ══ headers / header-DVC ══ */
.header-dvc { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 35.840828px; }
.header-dvc .title { width: 183px; height: 27px; display: flex; align-items: center; color: var(--dvc-primary); }
.icon-gear { width: 35px; height: 35.840828px; flex: none; display: block; overflow: visible; }

/* ══ Rule / dvc ══
   Figma rules are ZERO-height lines with a centre-aligned stroke: they must
   contribute 0 to layout, or every element below drifts down by the stroke
   width. A border-top would add 1.5px each — measured as +1.5/+3 drift. */
.rule { width: 100%; height: 0; position: relative; }
.rule::after { content: ""; position: absolute; left: 0; right: 0;
  top: calc(var(--border-strong) / -2); height: var(--border-strong); background: var(--dvc-primary); }
.rule.thin::after { top: calc(var(--border-default) / -2); height: var(--border-default); background: var(--ink); }

/* ══ cards · category=dvc · type="points overview" ══
   Grid is 4 FLEX columns, 24 column-gap, 8 row-gap → 65.75 per column at 335.
   The drawn children are narrower than their column and sit at the column
   start (58 for the label column, 60 for the three value columns), so they
   are pinned rather than stretched. Heights are pinned to Figma's cap boxes
   (27 / 12) — browser cap metrics land at 12.24 and would accumulate. */
.overview { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 24px; row-gap: 8px; align-items: end; }
.overview > * { justify-self: start; width: 60px; }
.overview > .rowlabel, .overview > .colhead { width: 58px; }
.overview .yr { height: 27px; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; }
.overview .yr.now { background: var(--dvc-primary); }
.overview .yr:not(.now) { background: var(--surface); }
/* figwright reports color/ink for this text on every pill, but the deduped
   instance hides the active pill's override — the board render shows white
   (which is also the only AA-passing choice on --dvc-primary). */
.overview .yr span { color: var(--ink); }
.overview .yr.now span { color: var(--on-primary); }
.overview .cell { height: 12px; text-align: center; color: var(--ink); }
.overview .cell.now { font-weight: 600; }
.overview .rowlabel { height: 12px; color: var(--ink); text-align: center; }

/* ══ Points Used section ══ */
.pu-section { display: flex; flex-direction: column; gap: 8px; }
.pu-label { height: 14px; color: var(--dvc-primary); }

/* ══ cards · category=dvc · type=points-usage ══ */
.usage { border-radius: var(--radius-compact-card); background: var(--surface-overlay);
  padding: 6px 0 8px; display: flex; flex-direction: column; gap: 5px; }
.usage .head { height: 24px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.usage .head .who { display: flex; align-items: center; gap: 4px; }
.usage .head .trip { color: var(--dvc-primary); }
.usage .head .days { width: 78px; color: var(--dvc-primary); }
.icon-pencil { width: 24px; height: 24px; flex: none; display: block; filter: drop-shadow(0 1px 1.5px rgba(30,30,30,0.10)); }
.usage .grid { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 24px; row-gap: 5px; }
.usage .grid > * { justify-self: start; width: 60px; height: 11px; text-align: center; color: var(--ink); }
.usage .grid > .rowlabel { width: 58px; }

/* ══ DVC-cards ══ */
.card { width: 100%; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card);
  padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
/* Figma strokeAlign INSIDE draws the stroke within the frame's own size, so it
   must NOT grow an auto-height box the way a CSS border does (measured: +1.6px
   per card, +2.4px per field, compounding down the column). Inset rings give
   the same pixels with zero layout cost. */
.card.outlined { box-shadow: var(--shadow-card), inset 0 0 0 var(--stroke-card) var(--card-stroke); }
.card .h3 { height: 14px; color: var(--ink); }

/* Container — centres the active card in the leftover height (board: Container
   FILL vertical, primary CENTER; the 81px symmetric padding on 03/04 has no
   visual effect once centred, and 04a/05 read 0). */
.container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.container.top { justify-content: flex-start; }

/* ══ cta-buttons ══ */
.cta { height: var(--cta-h); border-radius: calc(var(--cta-h) / 2); padding: 0 24px;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 17px; line-height: 120%; }
.cta-fill { background: var(--dvc-primary); color: var(--on-primary); }
.cta-outline { background: transparent; color: var(--ink); border: var(--border-default) solid var(--ink); }
.cta[disabled], .cta.off { opacity: var(--disabled); cursor: default; pointer-events: none; }
.cta-row { display: flex; align-items: center; gap: 8px; justify-content: center; }
/* 35x36 with 232 / 437px of clear space — full 44, nothing drawn moves. */
[data-open-setup] { position: relative; }
[data-open-setup]::after { content: ''; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); width: 44px; height: 44px; }
/* 9 -> 44 (the design director 2026-08-01). The weakest control in the app: a 9px-tall
   button 16px from its neighbour, so a hit-area overlay could only reach 25
   before the two collided. This one buys the height instead — ⚠ it GROWS the
   drawn block ~35px, so the board is amended rather than the change left
   silent (rule 6); logged in TODO. */
.add-more { height: 44px; color: var(--ink); text-align: center; }

/* ══ Input Fields · dvc · Contract Info ══ */
.contract { width: 305px; box-shadow: inset 0 0 0 var(--border-default) var(--border); border-radius: var(--radius-field);
  background: var(--surface); padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.contract .r1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.contract .r1 .name { color: var(--ink); }
.icon-x { width: 16px; height: 16px; flex: none; display: block; }
.contract .resort { display: flex; align-items: center; gap: 4px; }
.contract .resort > .lbl { color: var(--ink); flex: none; }
.pill { flex: 1; height: 20px; box-shadow: inset 0 0 0 var(--border-default) var(--border); border-radius: 10px;
  padding: 4px 12px; display: flex; align-items: center; gap: 4px; position: relative; overflow: hidden; }
/* Long resort names truncate here too (the design director 2026-08-01), the same call as
   Track Your Points and Spend's trip picker. The pill already clips with
   `overflow: hidden`, so `flex: none` meant a long name was CUT rather than
   ellipsised — and it pushed the arrow out of the pill on its way. */
.pill .val { color: var(--ink); flex: 0 1 auto; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill .spacer { flex: 1; display: flex; justify-content: flex-end; align-items: center; }
.pill select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; cursor: pointer; }
.arrow { width: 18px; height: 11px; flex: none; display: block; }
.contract .r3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.contract .fields { width: 153.25px; display: flex; flex-direction: column; gap: 8px; }
/* Board rows are 14 / 14 / 12 tall with 8 gaps → the fields column is exactly
   56. A bare input takes its own line-height (~18px) and inflated each row. */
.fieldline { height: 14px; display: flex; align-items: flex-start; gap: 8px;
  position: relative; }   /* containing block for the two pickers' hit areas */
.fieldline.dues-row { height: 12px; }
.fieldline .k { color: var(--ink); flex: none; }
.fieldline .line { width: 90px; height: 14px; box-shadow: inset 0 -1px 0 var(--border); display: flex; align-items: flex-end; }
.fieldline .line input { width: 100%; height: 13px; border: 0; background: transparent; outline: none;
  font-weight: 400; font-size: 15px; line-height: 13px; color: var(--ink); padding: 0; }
/* Use Year and Expiring-in are PICKERS (the design director, 2026-08-02). The drawn field is
   unchanged — same 90x14 box, same rule, same 15/13 ink — so `.val` reproduces
   what the <input> painted and the <select> sits invisibly over it. That is
   the pattern this file already uses three times (`.pill`, `.rec-row .who`,
   `.rec-row .yr`).
   A hit area may grow where painted ink may not, so the select is sized to the
   whole FIELDLINE — label included, which makes "Use Year: [ Feb ]" one target
   instead of an 81x14 sliver. MEASURED, not assumed: the two rows sit on a
   22px pitch (14 tall, 8 apart), so 22 is the tallest either area can be
   before they overlap each other and start stealing each other's taps. That
   is the Trips check-line trade-off again — wide-but-short, under the 44 bar,
   and the pitch is the only thing that could give more.
   ⚠ A first attempt used inset -15px for a true 44, and the two areas DID
   overlap. Do not reintroduce it without changing the drawn pitch. */
.fieldline .line .val { width: 100%; height: 13px; font-weight: 400; font-size: 15px;
  line-height: 13px; color: var(--ink); overflow: hidden; white-space: nowrap; }
.fieldline .line select { position: absolute; inset: -4px 0; opacity: 0;
  width: auto; height: auto; border: 0; cursor: pointer; }
.fieldline .line:focus-within { box-shadow: inset 0 -1.5px 0 var(--dvc-primary); }
.dues { color: var(--ink); display: flex; align-items: baseline; gap: 0;
  white-space: nowrap; }  /* board: hug-width label overflowing its column, never wrapped */
.dues .opt { cursor: pointer; }
.dues .opt.sel { font-weight: 600; font-size: 17px; color: var(--ink); }
.dues .opt:not(.sel) { font-weight: 400; font-size: 15px; color: var(--muted); }
.points-box { width: 74px; align-self: stretch; box-shadow: inset 0 0 0 var(--stroke-field) var(--border);
  border-radius: var(--radius-field); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; }
.points-box input { width: 100%; height: 17px; text-align: center; border: 0; background: transparent; outline: none;
  font-weight: 700; font-size: 23px; line-height: 17px; color: var(--muted); }
.points-box .unit { color: var(--muted); }

/* ══ reconcile row ══ */
/* The reconcile card carries a title + a FORM FIELD row — no header strip
   (that belongs to the Contract Info box, which has its own name + remove
   control). So the contract name here is field-weight, not the SemiBold 19
   that read as a section header. the design director 2026-07-25. */
/* 1fr auto 1fr keeps the year optically centred in the card's content box
   whatever the contract name's length — space-between would have parked it
   wherever the name happened to end. min-width:0 stops a long name from
   stealing width off the centre track. */
.rec-row { min-height: 20px; display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 16px; }
.rec-row .who { color: var(--ink); grid-column: 1; justify-self: start; position: relative;
  min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-row .who select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; cursor: pointer; }
.rec-row .yr { color: var(--ink); grid-column: 2; justify-self: center; text-align: center; position: relative; }
.rec-row .yr select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; cursor: pointer; }
.rec-row .amt { grid-column: 3; justify-self: end; display: flex; align-items: baseline; gap: 6px; }
.rec-row .unit { color: var(--muted); }
/* the underline IS the field: it hugs the input rather than trailing past the
   right-aligned text as a stray bar, and the whole box focuses it. Width is
   sized to the values that actually arrive: point usages run to a few
   thousand, ~10,000 at the very top, so the original 90px rule was drawn for
   numbers that never show up. Measured at Regular 17: "2400" = 40.1px,
   "10000" = 48.1px, and "99999" (the maxlength-5 ceiling) = 52.8px — 60px
   holds any of them with caret room to spare. */
.rec-row .line { width: 60px; height: 20px; flex: none; box-shadow: inset 0 -1px 0 var(--border);
  display: flex; align-items: flex-end; cursor: text; }
.rec-row .act { width: 100%; height: 18px; padding: 0 0 1px; text-align: right;
  border: 0; background: transparent; outline: none;
  font-weight: 400; font-size: 17px; line-height: 18px; color: var(--ink); }
.rec-row .act::placeholder { color: var(--muted); }
.rec-row .line:focus-within { box-shadow: inset 0 -1.5px 0 var(--dvc-primary); }
/* Focus indicator — the same rule the other screens carry. DVC was missing it,
   so 18 controls focused invisibly (WCAG 2.4.7). tools/focus-walk.js. */
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

/* ══ trip box (03 empty · 04 selected) ══ */
.tripbox { width: 100%; box-shadow: inset 0 0 0 var(--stroke-field) var(--card-stroke); border-radius: var(--radius-field);
  background: var(--surface); padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.tripbox.h65 { height: 65px; }
/* Two lines, then truncate (the design director 2026-08-01). The board draws one line and
   the 2026-07-28 min-height rule lets a long title grow; this caps that growth
   at two rather than letting a 57-character name take three or four.
   -webkit-box is the only cross-browser line clamp that ships today, and it is
   supported everywhere this app runs. */
.tripbox .muted-copy { color: var(--ink-deep);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden; }
.tripbox .stay { display: flex; align-items: center; gap: 4px; }
.tripbox .stay .lead { color: var(--ink-deep); flex: none; }
/* Long resort names truncate (the design director 2026-08-01), the same call as Spend's
   trip-name picker. `flex: none` meant the name could not shrink, so
   "Disney's Grand Californian Hotel & Spa" pushed the row wider than the box
   instead of ending in an ellipsis.
   The name shrinks; `.lead` ("staying at") and `.spacer` do not. The spacer
   keeps its default `min-width: auto`, which is deliberate — it holds the
   stay-picker arrow AND the invisible <select> over it, so letting it collapse
   would truncate the name by making a control unhittable. */
.tripbox .stay .resort { color: var(--ink); flex: 0 1 auto; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tripbox .stay .spacer { flex: 1; display: flex; justify-content: flex-end; align-items: center; position: relative; }
/* inset -16, not 0 (2026-08-01). This is the stay picker: an invisible
   <select> sized to the 18x11 arrow it sits over, which makes it an 18x11 tap
   target — and the touch-target audit could not catch it, because it only
   exists when a household has TWO OR MORE eligible stays and the seeded ledger
   has one. Negative inset grows the hit area to 50x43 without moving the drawn
   arrow, the same trick Insights' view dots already use. */
.tripbox .stay .spacer select { position: absolute; inset: -16px; opacity: 0; width: auto; height: auto; border: 0; cursor: pointer; }
.tripbox .dates { color: var(--ink-deep); }
/* min-height, not height (the design director 2026-07-28, from a screenshot of the real
   ledger): the board draws one line per row, so 11px IS the drawn cap box —
   but a trip title long enough to wrap still OCCUPIED 11px, and its second
   line painted straight through "staying at …" below it. The same fix chunk 7
   applied to Home's text nodes: keep the drawn box as a floor and let real
   content grow it. The `.stay` row keeps its own line pinned, since the
   resort name sits beside a label rather than under one. */
.tripbox > * { min-height: 11px; flex: none; }
.tripbox.h65 > * { height: auto; }
/* Board draws this frame 305 wide inside a 335 card whose padding box is 303 —
   a HUG artifact that overflows the padding by 1px a side and centres (x=15). */
.trip-group { width: 305px; display: flex; flex-direction: column; gap: 8px; }
.trip-group.empty { width: 305.5px; }
.trip-group .h3 { height: 14px; }

/* ══ 05 Add Reservation — points-allocation-form ══ */
.alloc-head { width: 100%; border-radius: var(--radius-field); background: var(--surface);
  display: flex; flex-direction: column; justify-content: center; gap: 8px; }
/* min-height, not height (2026-08-01). This is the SAME defect the 2026-07-28
   note above describes and fixes for `.tripbox` — and state 05 is a parallel
   block that never got it, because it is different markup (`.alloc-head` with
   `#resv-*` ids, not `.tripbox`). A hard 11px pinned each row while its content
   wrapped, so "staying at" and a long resort name painted straight through the
   title above and the dates below. Same remedy: keep the drawn box as a floor
   and let real content grow it. */
.alloc-head > * { min-height: 11px; height: auto; flex: none; }
/* The row must be allowed to shrink before its name can truncate — a flex
   item defaults to min-width: auto and refuses to go below its content. */
.alloc-head .stay { min-width: 0; }
/* "staying at" does not shrink — only the name does. `.tripbox`'s equivalent
   carries `.lead { flex: none }`; this block's label is an inline-styled span
   with no class, so it was shrinking to "staying / at" over two lines and
   making the row 29px tall. */
.alloc-head .stay > span:first-child { flex: none; }
/* Long resort names truncate here too (the design director 2026-08-01), matching Track Your
   Points and the contract card. This one is an id, not `.resort`, which is why
   the `.tripbox .stay .resort` rule never reached it. */
.alloc-head .stay > #resv-resort { min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* The trip title wraps to two lines then truncates, as on Track Your Points.
   `.card .h3` pins 14px for every heading in a card, which is right for the
   one-line ones ("Points Allocation") and wrong for a real trip name. Scoped
   to this title so nothing else moves. */
#resv-trip { height: auto; min-height: 14px;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden; }
/* Board: a 187×0 LINE stroked white — invisible, and zero-height, so it only
   contributes its two flex gaps (8 + 8). A border-top would add a 1px row. */
.alloc-spacer { width: 187px; height: 0; }
.alloc { width: 100%; box-shadow: inset 0 0 0 var(--border-strong) var(--border); border-radius: var(--radius-input);
  background: var(--surface); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.alloc .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.alloc .meta .who, .alloc .meta .avail { color: var(--ink); }
.alloc .box { width: 74px; height: 48px; flex: none; box-shadow: inset 0 0 0 var(--border-default) var(--border);
  border-radius: var(--radius-points); background: var(--surface);
  display: flex; align-items: center; justify-content: center; padding: 8px 14px; }
.alloc .box input { width: 100%; height: 17px; text-align: center; border: 0; background: transparent; outline: none;
  font-weight: 700; font-size: 23px; line-height: 17px; color: var(--muted); }
/* Board draws the Total row's number bare — the bordered box belongs to the
   editable contract rows only. */
.alloc.total .box { box-shadow: none; }
.alloc.total .box input { color: var(--muted); }
.cta-bleed { width: calc(100% + 32px); margin: 0 -16px; display: flex; align-items: center; justify-content: center; }

/* ══ Footer · variant DVC ══ */
footer.footer { flex: none; height: var(--footer-h); background: var(--surface);
  border-top: 1.900338px solid var(--deco); display: flex; justify-content: center; }
.tab { position: relative; width: 75px; height: 83.901894px;
  display: block; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; border-radius: 8px; }
.tab .label { position: absolute; top: 60px; left: 0; right: 0; text-align: center; color: var(--ink); }
.tab.on .label { color: var(--primary); }
.tab svg { position: absolute; }
/* ══ iOS safe areas (the design director, 2026-08-02) ═══════════════════════════════════
   Reported on the live beta: a yellow strip under the footer, on every
   screen. Without `viewport-fit=cover` Safari keeps the layout OUT of the
   safe areas and paints them with the html background — which is the theme
   colour, so the home-indicator band read as the footer stopping short.
   Cover hands the layout those bands; `padding-top` on body puts the
   content back exactly where it sat before, and the footer's own white now
   reaches the physical bottom edge. Nothing drawn moves — where there is no
   inset (every desktop browser, and any phone without an indicator) both
   values resolve to 0, so this is inert off iOS. */
body { padding-top: env(safe-area-inset-top, 0px); }
footer.footer {
  height: calc(var(--footer-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
</style>
</head>

<script type="module">
import { currentUY, uyFor, balance, outlookYears, eligibleSegments, prefillPoints,
  canSaveReservation, reservationsForTrip, setDuesTracking, isDuesTracked,
  contractLabel } from './js/dvc.js';
import { openIdb } from './js/storage/adapter-idb.js';
import { createRepo } from './js/storage/repo.js';
import { draftSaveable } from './js/dvc-gate.js';

const UY_NAME = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* Expiry-year picker range (the design director, 2026-08-02: "expiration year is a year
   picker"). DERIVED, not a hard-coded DVC era: this year through +60. A deed
   is ~50 years, so every real contract — the 2042 originals through the newest
   announced resort — falls inside it, and it can never go stale the way a
   literal "2042-2080" would. `repo.saveContract` accepts 1990-2200, so every
   offered value is one the store will take; the picker cannot produce a
   rejection. `data/dvc-canonical.json` carries no per-resort expiry, so there
   is nothing to derive this from instead. */
const EXPIRY_YEARS = Array.from({ length: 61 }, (_, k) => new Date().getFullYear() + k);
const TODAY = new Date();

/* Storage failure degrades to "cannot save", never to a dead screen. */
let repo = null;
try { repo = createRepo(await openIdb()); }
catch (e) { console.error('DVC: storage unavailable, running read-only —', e); }

/* The 19 DVC resorts ship as a datasheet (data/hotels.json) and are seeded on
   every boot — seedHotels fills gaps, and overwrites only where the shipped
   row carries a higher `seed_rev` than the stored one (a deliberate datasheet
   correction), so this never clobbers a stored row or the off-property hotels
   Trips creates. HOTELS was four hardcoded resorts
   before chunk 4b; it is now every seeded property, keyed by the same
   3-letter id that joins the dues table and renders the summary row label.

   TWO maps, not one (the design director 2026-08-01). HOTELS resolves ANY hotel id to a
   name, because a stay booked on points can be at a non-villa resort through
   the Disney Collection — Track Your Points has to be able to name it.
   DVC_HOTELS is the subset a CONTRACT can be at, and a contract's home resort
   is a DVC resort by definition.
   ⚠ This split is a REGRESSION FIX, not a new feature. The home-resort picker
   reads `Object.entries(...)`, and until 2026-07-28 data/hotels.json shipped
   19 rows that were all `dvc_villa` — so it was DVC-only by accident. Growing
   the datasheet to 44 rows to build the Trips hotel picker silently put Pop
   Century, Swan and Shades of Green into the list of resorts you can own
   points at. 19 rows, not 44, and deliberately fewer than the on-property
   list Trips offers. */
const HOTELS = {};
const DVC_HOTELS = {};
async function loadHotels() {
  if (!repo) return;
  try {
    const sheet = await fetch('./data/hotels.json').then(r => r.json());
    await repo.seedHotels(sheet.hotels ?? []);
  } catch (e) { console.warn('DVC: resort seed unavailable —', e.message); }
  for (const h of await repo.listHotels()) {
    HOTELS[h.id] = h.name;
    /* is_dvc is the schema's own answer to "can points be owned here", so it
       is what filters — not the category string, which also has to serve the
       Trips picker's value/moderate/deluxe grouping. */
    if (h.is_dvc && h.active !== false) DVC_HOTELS[h.id] = h.name;
  }
}

/* Everything below is read from storage, never sampled. Segments come from
   Trips (chunk 2b): a stay is offered here only when its on_points box is
   ticked — eligibleSegments() keys on that flag, not on the hotel's category,
   so a stay booked at a free-text hotel still qualifies. */
let contracts = [], trips = [], segments = [], reservations = [], entries = [];

async function loadAll() {
  if (!repo) return;
  contracts = await repo.listContracts();
  trips = await repo.listTrips();
  segments = (await Promise.all(trips.map(t => repo.segmentsOf(t.id)))).flat();
  reservations = await repo.listReservations();
  entries = (await Promise.all(contracts.map(c => repo.entriesForContract(c.id)))).flat();
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const states = [...document.querySelectorAll('.state')];
function show(id) { states.forEach(s => s.classList.toggle('on', s.dataset.state === id)); $('main').scrollTop = 0; }

const fmtDate = iso => { const [y,m,d] = iso.split('-'); return `${m}/${d}/${y.slice(2)}`; };
const checkOut = seg => { const d = new Date(seg.check_in+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+seg.nights); return d.toISOString().slice(0,10); };

/* ══ cards · points overview ══
   Three year pills with the MIDDLE one active (2025 / **2026** / 2027 against
   a 2026 "today"): previous · current · next. Columns are per contract, since
   each contract's use year starts in its own month — so two contracts on one
   screen can legitimately show different year triples.

   CORRECTED 2026-08-02: this comment used to say the window was "one column
   earlier than DVC-SPEC §3" and that "the spec line needs syncing". It does
   not. The spec was AMENDED to last/this/next on 2026-07-25, and the old
   wording sits struck through directly above that amendment — whoever wrote
   this read the struck line as the live one. The code here was right; the note
   about it was wrong, and it made a correct build look like a deviation.

   The window comes from js/dvc.js now, so there is ONE definition. There were
   two, and the OTHER one still had the rejected window — see js/dvc.js. */
function renderOverview(el) {
  const head = outlookYears(TODAY);
  /* The header is the CALENDAR triple and no longer depends on contracts[0],
     so the middle pill is the current calendar year for every row — which is
     what made the single header honest. It used to take the first contract's
     use-year window while each row took its own, so two contracts with
     different use-year months put their numbers under the wrong headings. */
  let html = `<div class="colhead"></div>` + head.map((y,i) =>
    `<div class="yr ${i===1?'now':''}"><span class="t-15b txt">${y}</span></div>`).join('');
  contracts.forEach(c => {
    /* derived "abbr + ordinal" (the design director 2026-07-27) — never the free-text
       nickname, which nothing guarantees is short or even present */
    html += `<div class="rowlabel t-17 txt">${esc(contractLabel(c, contracts))}</div>`;
    /* `now` follows the contract's CURRENT USE YEAR, never the column index.
       A Sep–Dec use year is still living in Y-1 in August, so its live column
       is the LEFT one; marking the middle would tell that member they are
       spending a year they have not entered yet. */
    const uy0 = currentUY(c, TODAY);
    html += head.map(uy =>
      `<div class="cell t-17 txt ${uy===uy0?'now':''}" title="UY ${uy}">${balance(c, uy, entries)}</div>`).join('');
  });
  el.innerHTML = html;
}

/* ══ cards · points-usage ══ */
function renderPointsUsed(el) {
  const used = trips.filter(t => reservationsForTrip(t, segments, reservations).length);
  el.innerHTML = used.map(t => {
    const resvs = reservationsForTrip(t, segments, reservations);
    const segIds = new Set(resvs.map(r => r.id));
    const nights = segments.filter(s => s.trip_id === t.id && resvs.some(r => r.segment_id === s.id))
      .reduce((n,s) => n + s.nights, 0);
    const rows = contracts.map(c => {
      /* same calendar triple as the overview, and the same rule for which
         column reads as current: the contract's own use year, not the index */
      const uy0 = currentUY(c, TODAY);
      const cells = outlookYears(TODAY).map(uy => {
        const n = -entries.filter(e => e.contract_id===c.id && e.use_year===uy && segIds.has(e.reservation_id))
          .reduce((s,e) => s+e.points, 0);
        return `<span class="${uy===uy0?'t-15b':'t-15'} txt">${n}</span>`;
      }).join('');
      return `<span class="rowlabel t-15 txt">${esc(contractLabel(c, contracts))}</span>${cells}`;
    }).join('');
    return `<div class="usage">
      <div class="head">
        <div class="who">
          <span class="trip t-15b txt">${esc(t.title)}&nbsp;</span>
          <span class="days t-15 txt">${nights} Days</span>
        </div>
        <svg class="icon-pencil" viewBox="3 2 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="2" width="24" height="24" rx="12" fill="var(--dvc-primary)"/>
          <path d="M8.00049 20.5005C8.00049 20.2243 8.39223 20.0005 8.87546 20.0005H21.125C21.6083 20.0005 22 20.2243 22 20.5005C22 20.7766 21.6083 21.0005 21.125 21.0005H8.87546C8.39223 21.0005 8.00049 20.7766 8.00049 20.5005Z" fill="#fff"/>
          <path d="M20.206 5.71492C19.1809 4.763 17.5188 4.76299 16.4936 5.71491L9.64847 12.0711C9.4885 12.2197 9.37258 12.4041 9.31199 12.6065L8.03676 16.8664C7.83617 17.5364 8.5003 18.1531 9.22189 17.9668L13.8094 16.7827C14.0274 16.7264 14.226 16.6188 14.386 16.4703L21.2311 10.1141C22.2563 9.16215 22.2563 7.61877 21.2311 6.66684L20.206 5.71492Z" fill="#fff"/>
        </svg>
      </div>
      <div class="grid">${rows}</div>
    </div>`;
  }).join('');
}

/* ══ DVC-cards · no-trop (03) / log-points (04) ══ */
let pullIndex = 0;
function renderActiveCard(el) {
  const elig = eligibleSegments(segments, reservations, trips, TODAY);
  if (!elig.length) {
    el.innerHTML = `<div class="card outlined" style="gap:18px">
      <div class="trip-group empty">
        <p class="h3 t-h3 txt">Track Your Points</p>
        <div class="tripbox h65">
          <span class="muted-copy t-15 txt">No trips to link.<br>Plan your trips first.</span>
        </div>
      </div>
      <button class="cta cta-fill off" style="width:146px"><span class="txt">LOG POINTS</span></button>
    </div>`;
    return;
  }
  const seg = elig[pullIndex % elig.length];
  const trip = trips.find(t => t.id === seg.trip_id);
  el.innerHTML = `<div class="card outlined" style="gap:18px">
    <div class="trip-group">
      <p class="h3 t-h3 txt">Track Your Points</p>
      <div class="tripbox">
        <span class="muted-copy t-15 txt">${esc(trip.title)}</span>
        <div class="stay">
          <span class="lead t-15 txt">staying at&nbsp;</span>
          <span class="resort t-15b txt">${esc(HOTELS[seg.hotel_id] ?? seg.hotel_id)}</span>
          <span class="spacer">
            ${elig.length > 1 ? `<svg class="arrow" viewBox="0 0 18 11" fill="none"><path d="M18 0L9 11L0 0H18Z" fill="var(--border)"/></svg>
            <select id="seg-pick" aria-label="Choose stay">${elig.map((s,i) =>
              `<option value="${i}" ${i===pullIndex%elig.length?'selected':''}>${esc(trips.find(t=>t.id===s.trip_id).title)} — ${esc(HOTELS[s.hotel_id]??s.hotel_id)}</option>`).join('')}</select>` : ''}
          </span>
        </div>
        <span class="dates t-15 txt">from ${fmtDate(seg.check_in)} through ${fmtDate(checkOut(seg))}</span>
      </div>
    </div>
    <button class="cta cta-fill" style="width:146px" id="log-points"><span class="txt">LOG POINTS</span></button>
  </div>`;
  $('#seg-pick')?.addEventListener('change', e => { pullIndex = +e.target.value; renderActive(); });
  $('#log-points')?.addEventListener('click', () => openReservation(seg));
}

/* ══ 05 Add Reservation ══ */
let activeSeg = null, alloc = [], allocTotal = 0;
function openReservation(seg) {
  activeSeg = seg;
  const trip = trips.find(t => t.id === seg.trip_id);
  $('#resv-trip').textContent = trip.title;
  $('#resv-resort').textContent = HOTELS[seg.hotel_id] ?? seg.hotel_id;
  $('#resv-dates').textContent = `from ${fmtDate(seg.check_in)} through ${fmtDate(checkOut(seg))}`;
  alloc = prefillPoints(contracts, seg, 0);   // user types the confirmation's points per contract
  renderOverview($('#ov-resv'));
  renderPointsUsed($('#pu-resv'));
  renderAllocRows();
  show('05');
}
function renderAllocRows() {
  const host = $('#resv-rows');
  host.innerHTML = alloc.map((a,i) => {
    const c = contracts.find(cc => cc.id === a.contract_id);
    return `<div class="alloc">
      <div class="meta">
        <span class="who t-15 txt">${esc(c.nickname)} • ${UY_NAME[c.use_year_month]} UY</span>
        <span class="avail t-15 txt">${balance(c, a.use_year, entries)} pts available</span>
      </div>
      <div class="box"><input type="text" inputmode="numeric" data-i="${i}" value="${a.points||''}" placeholder="000" aria-label="${esc(c.nickname)} points"></div>
    </div>`;
  }).join('') + `<div class="alloc total" id="alloc-total">
      <div class="meta"><span class="who t-15 txt">Total Points</span><span class="avail t-15 txt">Used</span></div>
      <div class="box"><input type="text" inputmode="numeric" id="total-out" value="0" readonly tabindex="-1" aria-label="Total points used"></div>
    </div>`;
  host.querySelectorAll('input[data-i]').forEach(inp => inp.addEventListener('input', e => {
    const v = e.target.value.replace(/[^0-9]/g,''); e.target.value = v;
    alloc[+e.target.dataset.i].points = v === '' ? 0 : +v;
    syncTotal();
  }));
  syncTotal();
}
function syncTotal() {
  allocTotal = alloc.reduce((s,a) => s + (a.points||0), 0);
  $('#total-out').value = allocTotal;
  const ok = canSaveReservation(alloc, allocTotal) && allocTotal > 0;
  $('#alloc-total').classList.toggle('bad', !ok);
  $('#resv-save').toggleAttribute('disabled', !ok);
}
$('#resv-cancel').addEventListener('click', () => renderActive());
$('#resv-save').addEventListener('click', async () => {
  if (!repo || !activeSeg) return;
  const btn = $('#resv-save');
  if (btn.disabled) return;
  btn.disabled = true;                       /* no double-post */
  try {
    /* One reservation per SEGMENT, never per trip (DATA-MODEL §5b): a split
       stay on points is two reservations, exactly as the DVC website shows.
       saveReservation writes one negative ledger entry per contract, so the
       balance falls out of the ledger and is never stored. */
    await repo.saveReservation(
      { segment_id: activeSeg.id, points_total: allocTotal, notes: null }, alloc);
  } catch (e) {
    console.warn('DVC: reservation rejected —', e.message);
    btn.disabled = false;
    return;
  }
  pullIndex = 0;
  await loadAll();
  renderActive();
});

/* ══ 02 Contract SetUp ══ */
let draft = [];
function renderSetup() {
  $('#setup-rows').innerHTML = draft.map((c,i) => `
    <div class="contract">
      <div class="r1">
        <span class="name t-h3 txt">Contract ${i+1}</span>
        <button data-del="${i}" aria-label="Remove contract ${i+1}" style="display:flex">
          <svg class="icon-x" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M0 8C0 3.58172 3.58172 0 8 0C12.4183 0 16 3.58172 16 8C16 12.4183 12.4183 16 8 16C3.58172 16 0 12.4183 0 8ZM6.16569 5.03431C5.85327 4.7219 5.34673 4.7219 5.03431 5.03431C4.7219 5.34673 4.7219 5.85327 5.03431 6.16569L6.86863 8L5.03431 9.83432C4.7219 10.1467 4.7219 10.6533 5.03431 10.9657C5.34673 11.2781 5.85327 11.2781 6.16569 10.9657L8 9.13137L9.83432 10.9657C10.1467 11.2781 10.6533 11.2781 10.9657 10.9657C11.2781 10.6533 11.2781 10.1467 10.9657 9.83432L9.13137 8L10.9657 6.16569C11.2781 5.85327 11.2781 5.34673 10.9657 5.03431C10.6533 4.7219 10.1467 4.7219 9.83432 5.03431L8 6.86863L6.16569 5.03431Z" fill="var(--ink)"/>
          </svg>
        </button>
      </div>
      <div class="resort">
        <span class="lbl t-15 txt">Home Resort:</span>
        <div class="pill">
          <span class="val t-15b txt">${c.resort_hotel_id ? esc(HOTELS[c.resort_hotel_id]) : 'Resort Name'}</span>
          <span class="spacer"><svg class="arrow" viewBox="0 0 18 11" fill="none"><path d="M18 0L9 11L0 0H18Z" fill="var(--border)"/></svg></span>
          <select data-i="${i}" data-f="resort_hotel_id" aria-label="Home resort">
            <option value="" ${!c.resort_hotel_id?'selected':''} disabled>Resort Name</option>
            ${Object.entries(DVC_HOTELS).map(([id,n]) => `<option value="${id}" ${id===c.resort_hotel_id?'selected':''}>${esc(n)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="r3">
        <div class="fields">
          <div class="fieldline"><span class="k t-15 txt">Use Year:</span>
            <span class="line"><span class="val t-15 txt">${c.use_year_month?UY_NAME[c.use_year_month]:''}</span>
              <select data-i="${i}" data-f="use_year_month" aria-label="Use year month">
                <option value="" ${!c.use_year_month?'selected':''} disabled></option>
                ${UY_NAME.slice(1).map((n,k) => `<option value="${k+1}" ${k+1===c.use_year_month?'selected':''}>${n}</option>`).join('')}
              </select></span></div>
          <div class="fieldline"><span class="k t-15 txt">Expiring in:</span>
            <span class="line"><span class="val t-15 txt">${c.expiry_year||''}</span>
              <select data-i="${i}" data-f="expiry_year" aria-label="Expiry year">
                <option value="" ${!c.expiry_year?'selected':''}></option>
                ${EXPIRY_YEARS.map(y => `<option value="${y}" ${y===c.expiry_year?'selected':''}>${y}</option>`).join('')}
              </select></span></div>
          <div class="fieldline dues-row"><span class="dues t-15 txt">Track Annual Dues:&nbsp;<button type="button" class="opt ${c.track_dues?'sel':''}" data-i="${i}" data-dues="1" aria-pressed="${c.track_dues?'true':'false'}">Yes</button>&nbsp;/&nbsp;<button type="button" class="opt ${c.track_dues?'':'sel'}" data-i="${i}" data-dues="0" aria-pressed="${c.track_dues?'false':'true'}">No</button></span></div>
        </div>
        <div class="points-box">
          <input type="text" inputmode="numeric" maxlength="4" data-i="${i}" data-f="points_per_year" value="${c.points_per_year||''}" placeholder="000" aria-label="Points per year">
          <span class="unit t-12 txt">points</span>
        </div>
      </div>
    </div>`).join('');

  $('#setup-rows').querySelectorAll('select[data-f], input[data-f]').forEach(el =>
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', e => {
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      if (f === 'points_per_year') {
        const v = e.target.value.replace(/[^0-9]/g,''); e.target.value = v;
        draft[i][f] = v === '' ? 0 : +v;
      } else if (f === 'use_year_month' || f === 'expiry_year') {
        /* Both are PICKERS (the design director, 2026-08-02), so the value can only ever
           be one this field offered — the parse that used to sit here is gone.
           expiry_year stays nullable: the blank option means "not recorded",
           and it must reach the store as null, never 0, which
           repo.saveContract rejects as an invalid year. */
        const v = e.target.value;
        draft[i][f] = v === '' ? (f === 'expiry_year' ? null : 0) : +v;
        e.target.closest('.line').querySelector('.val').textContent =
          f === 'use_year_month' ? (v === '' ? '' : UY_NAME[+v]) : v;
      } else { draft[i][f] = e.target.value; if (f==='resort_hotel_id') renderSetup(); }
      gateSetup();
    }));
  $('#setup-rows').querySelectorAll('[data-dues]').forEach(el => el.addEventListener('click', e => {
    const b = e.target.closest('[data-dues]');
    draft[+b.dataset.i].track_dues = b.dataset.dues === '1'; renderSetup();
  }));
  $('#setup-rows').querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', e => {
    draft.splice(+e.currentTarget.dataset.del, 1); if (!draft.length) draft.push(blankContract()); renderSetup();
  }));
  gateSetup();
}

/* The CTA gate (the design director, 2026-08-02) — the Trips ruling applied here: SAVE is
   dark until every contract in the draft is complete, so the silent drop that
   made an incomplete row VANISH (and the screen fall to zero state) can no
   longer be reached. The predicate is shared with repo.saveContract via
   js/dvc-gate.js rather than copied — the same mistake that once had three
   screens forecasting one trip differently.
   `.cta[disabled]` already carries the drawn disabled treatment
   (`opacity: var(--disabled)`), so nothing new is painted. */
function gateSetup() {
  $('#save-contracts').disabled = !draftSaveable(draft);
}
const blankContract = () => ({ id:'c'+Date.now()+Math.random(), nickname:'', resort_hotel_id:'', use_year_month:0, points_per_year:0, expiry_year:null, track_dues:false });
$('#add-contract').addEventListener('click', () => { draft.push(blankContract()); renderSetup(); });
$('#save-contracts').addEventListener('click', async () => {
  if (!repo) return;
  const keep = draft.filter(c => c.points_per_year > 0 && c.use_year_month > 0);
  /* A contract removed from the draft is removed from storage. deleteContract
     refuses while ledger entries exist (FK restrict), so a contract that has
     already spent points cannot be silently dropped along with its history. */
  const keepIds = new Set(keep.map(c => c.id));
  for (const old of await repo.listContracts()) {
    if (keepIds.has(old.id)) continue;
    try { await repo.deleteContract(old.id); }
    catch (e) { console.warn('DVC: kept ' + old.id + ' —', e.message); }
  }
  const year = TODAY.getFullYear();
  for (const [i, c] of keep.entries()) {
    /* The board's Yes/No toggle is a boolean; storage keeps a WINDOW so an
       opt-out stops future dues without erasing the years already tracked
       (js/dvc.js setDuesTracking). track_dues never reaches the store. */
    const { track_dues, ...row } = setDuesTracking(c, Boolean(c.track_dues), year);
    try {
      await repo.saveContract({ ...row, nickname: c.nickname || `Contract ${i+1}` });
    } catch (e) {
      /* saveContract enforces points > 0, a 1-12 use year and a sane expiry.
         There is no drawn error state, so nothing is invented — the reason
         goes to the console and the user stays in setup. */
      console.warn('DVC: contract rejected —', e.message);
      return;
    }
  }
  await loadAll();
  renderActive();
});

/* ══ Reconcile — rows are per (contract, use year) and independently
   addable: a household may reconcile only some contracts, or one contract
   across two use years (banked/borrowed). Never capped at contracts.length.
   delta = typed − derived; a zero delta writes no entry. ══ */
let recDraft = [];
const blankRec = () => { const c = contracts[0];
  return { contract_id: c?.id ?? '', use_year: c ? currentUY(c, TODAY) : TODAY.getFullYear(), actual: '' }; };
function renderRec() {
  if (!recDraft.length && contracts.length) recDraft = [blankRec()];
  $('#rec-rows').innerHTML = recDraft.map((r,i) => {
    const c = contracts.find(cc => cc.id === r.contract_id);
    /* the reconcile picker offers the same three years the cards show, so a
       member can reconcile the year they are actually spending — which for a
       borrowed Y+1 is the right-hand column */
    const yrs = c ? outlookYears(TODAY) : [];
    return `<div class="rec-row">
      <span class="who t-17 txt">${c ? esc(c.nickname) : '—'}
        <select data-i="${i}" data-f="contract_id" aria-label="Contract">${contracts.map(cc =>
          `<option value="${cc.id}" ${cc.id===r.contract_id?'selected':''}>${esc(cc.nickname)}</option>`).join('')}</select>
      </span>
      <span class="yr t-17 txt">${r.use_year}
        <select data-i="${i}" data-f="use_year" aria-label="Use year">${yrs.map(y =>
          `<option value="${y}" ${y===r.use_year?'selected':''}>${y}</option>`).join('')}</select>
      </span>
      <span class="amt">
        <span class="line"><input class="act" type="text" inputmode="numeric" maxlength="5"
          data-i="${i}" data-f="actual" value="${r.actual}" placeholder="000"
          aria-label="Actual points balance"></span>
        <span class="unit t-15 txt">points</span>
      </span>
    </div>`;
  }).join('');
  $('#rec-rows').querySelectorAll('select[data-f], input[data-f]').forEach(el =>
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', e => {
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      if (f === 'actual') { const v = e.target.value.replace(/[^0-9-]/g,''); e.target.value = v; recDraft[i].actual = v; }
      /* Re-render, exactly as the contract branch below does. The year is
         DRAWN as a text node with the native select overlaid on top of it
         (see the row markup above), so updating the model alone left the
         picker saying 2027 while the row still read 2025 — the model was
         right and the screen was lying about it.
         Re-rendering cannot lose a half-typed balance: `actual` lives in
         recDraft and is written straight back into the input's value. */
      else if (f === 'use_year') { recDraft[i].use_year = +e.target.value; renderRec(); }
      else { recDraft[i].contract_id = e.target.value;
        const c = contracts.find(cc => cc.id === e.target.value);
        recDraft[i].use_year = c ? currentUY(c, TODAY) : recDraft[i].use_year; renderRec(); }
    }));
}
$('#add-rec').addEventListener('click', () => { if (contracts.length) { recDraft.push(blankRec()); renderRec(); } });
$('#save-rec').addEventListener('click', async () => {
  if (!repo) return;
  for (const r of recDraft) {
    if (r.actual === '' || !r.contract_id) continue;
    const c = contracts.find(cc => cc.id === r.contract_id);
    if (!c) continue;
    /* delta = what the member actually sees on dvcmember.com minus what the
       ledger derives. A zero delta writes nothing: reconciling a balance that
       already agrees should leave no trace. */
    const delta = Number(r.actual) - balance(c, r.use_year, entries);
    if (delta === 0) continue;
    try {
      await repo.saveLedgerEntry({ contract_id: r.contract_id, use_year: r.use_year,
        points: delta, reservation_id: null, note: 'reconcile' });
    } catch (e) { console.warn('DVC: reconcile rejected —', e.message); return; }
  }
  recDraft = [];
  await loadAll();
  renderActive();
});

/* ══ entry points ══ */
function renderActive() {
  if (!contracts.length) { show('01'); return; }   /* 01 Zero: no contract yet */
  renderOverview($('#ov-active'));
  renderPointsUsed($('#pu-active'));
  renderActiveCard($('#active-container'));
  show('active');
}
document.querySelectorAll('[data-open-setup]').forEach(b => b.addEventListener('click', () => {
  draft = contracts.length ? contracts.map(c => ({...c})) : [blankContract()];
  recDraft = []; renderSetup(); renderRec(); show('02');
}));
document.querySelectorAll('[data-close-setup]').forEach(b => b.addEventListener('click', () => renderActive()));

/* dev harness — ?state=01|02|active|05, ?contracts=N, ?resv=none.
   These can only NARROW what storage holds; they never fabricate rows. */
const q = new URLSearchParams(location.search);
await loadHotels();
await loadAll();
if (q.get('contracts') !== null) contracts = contracts.slice(0, +q.get('contracts'));
if (q.get('resv') === 'none') { reservations = []; entries = []; }
renderActive();
if (q.get('state') === '02') document.querySelector('[data-open-setup]').click();
</script>
</body>
</html>
