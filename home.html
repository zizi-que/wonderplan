<!DOCTYPE html>
<!--
  Home — real screen. Visual truth: Figma Home section 6:387, read via
  figwright 2026-07-26.

  Frames (all four exist and are variable-bound — the "Home & Trips Figma
  match-back" backlog item was stale for Home):
    Home / Spec               58:6941
    01. Zero                  61:2706   ← built
    02. Active                61:2759   ← built
    02a. Active-more trips    61:2811   ← built
    03. Theme-update          83:3232   ← built (4x4 grid of 78px theme chips)

  TRANSLATION NOTE — Home is a MIXED frame, unlike Spend / DVC / Insights.
  Those frames are auto-layout all the way down, so the build reproduces
  padding/gap/hug-fill. Home's top level is **absolutely positioned**: the
  castle, the settings glyph, the wordmark, the card stack and the theme
  `screen` carry literal x/y on the 375x812 page. Inside those boxes the
  design IS auto-layout (Frame 29 stack, every `cards` instance, the theme
  screen and its 4x4 grid), so the inside is built the usual flex way.
  Every left/top below is the frame's own drawn coordinate.

  Vectors are exact Figma SVG exports with their bound fills swapped for
  tokens, kept once as <symbol> and referenced per state:
    #castle-lg    61:2992 — 01/02/02a castle. figwright clips it to the page,
                  so it exports 375x360 and sits at y=1. Verified identical to
                  02's own copy (61:3046) — same art, float-rounding only.
    #castle-sm    83:3234 — the 03 castle: the same art scaled to 78%, in a
                  369x283 frame at x=3. Not a CSS scale of the large one; the
                  clip window differs, so it is its own export.
    #wordmark     80:3153 — "YOUR MAGICAL VACATION" as outlined type.
    #glyph-settings 83:3225 (`icon-edit` / `setting-primary`) — a four-point
                  sparkle over three rules, the same sparkle family as the DVC
                  settings icon, never a gear.
    #pencil       61:2434 / 61:2427 — the 24px card-header edit button. One
                  symbol, two variants via --pen-bg / --pen-ink. Drawn with
                  viewBox="3 2 24 24" so the export's shadow padding is
                  cropped and the CSS drop-shadow carries the effect, the
                  convention dvc.html already uses.
    #palette      83:3334 — the five-sparkle theme swatch. One symbol, 16
                  chips, colours per chip via --s1..--s5.

  Text boxes use `text-box: trim-both cap alphabetic` so element heights equal
  Figma's cap-height boxes, the translation law established by Spend/DVC.
  Two boxes are pinned SHORTER than their natural cap box because the board
  pins them: the 19px card titles (12, natural 14) and the 12px chip labels
  (12, natural 9). Figma top-aligns a fixed text box, and so does trim, so the
  cap top lands on the drawn y either way.

  Frozen Home laws honoured: spending is NEVER shown (the board's own
  "Forecast $5,120 / budget $5,500" line is drawn hidden in both trip-card
  variants and stays unrendered), there is no FAB, and `--attention` is never
  used on this screen.

  DELIBERATE DEVIATIONS FROM THE BOARD — both reported, neither silent:
  1. The theme chips paint LITERAL hexes, not tokens. Two chip swatches carry
     stray bindings on the board (Apple's second sparkle -> color/primary,
     Highland's first -> color/ink), harmless in Figma because the file has one
     mode, but in the app they would repaint another theme's chip whenever the
     active theme changed. A picker must show each theme's own palette.
  2. The next-trip card title uses --header-ink; the board binds color/surface.
     Identical (#FFFFFF) in all 16 themes, so zero pixel difference — but the
     band is color/header-bg, and header-ink is the token that is contracted
     to stay legible on it.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>WonderPlan — Home</title>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<!-- iOS is the platform this matters on. Safari evicts IndexedDB after 7 days
     without a visit, and a Home Screen app is exempt — so these tags are not
     polish, they are what stops a tester losing their ledger by not opening
     the app for a week. `apple-mobile-web-app-capable` is still required:
     iOS only began honouring the manifest's display mode in 16.4. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="WonderPlan" />
<meta name="theme-color" content="#DE2C47" />
<!-- No webfont <link>: Manrope and 42dot Sans are self-hosted in css/theme.css
     (the design director, 2026-08-02), so the app makes no third-party request at all. -->
<link rel="stylesheet" href="css/theme.css">
<!-- classic + blocking on purpose: sets <html data-theme> before first paint -->
<script src="js/theme.js"></script>
<style>
/* ══ Theme tokens live in css/theme.css — ONE copy for all five screens ══ */

/* ══ Structural tokens — Figma variables, values verified in the frame reads ══ */
:root {
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-count: "42dot Sans", var(--font);   /* next-trip countdown only */
  --radius-card: 14px;                 /* radius/card */
  --radius-compact-card: 12px;         /* radius/compact-card — days card */
  --radius-chip: 20px;                 /* pchip — unbound 20 on the board */
  --space-2: 12px; --space-3: 16px; --space-page: 20px;
  --footer-h: 85.802238px;
  --shadow-card: 0 1px 3px rgba(30,30,30,0.10);
  --col: 335px;                        /* content column, 375 − 20 − 20 */
}

/* ══ Base ══ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
/* ══ The app frame (the design director, 2026-07-27) ══════════════════════════════════
   The five screens used to disagree above 375px: Home and Trips pinned their
   content left (states positioned at literal board coordinates), while Spend,
   DVC and Insights centred theirs. the design director chose centred for all.

   The whole frame is capped and centred — content AND footer together — so a
   wide window shows one phone-width column, not a narrow column sitting on a
   full-width bar. html carries the page colour so the margins match.

   At 375 and below this is completely inert, which is why it changes no
   audited pixel: 375 is the drawn width and the QA viewport.

   Home and Trips keep literal board coordinates INSIDE the frame — those are
   the drawn Figma values, and re-expressing them as flex gaps would mean
   inventing spacing nobody drew. Centring the frame achieves the chosen
   behaviour without touching them. */
html { background: var(--bg); }
body { font-family: var(--font); background: var(--bg); color: var(--ink);
  width: 100%;
  display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; background: none; border: 0; cursor: pointer; color: inherit; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.txt { text-box: trim-both cap alphabetic; }

/* ══ Text styles — Figma text styles, verbatim (height = pinned cap box) ══ */
.t-h1  { font-weight: 700; font-size: 23px; line-height: 145%; min-height: 17px; }
.t-17b { font-weight: 600; font-size: 17px; line-height: 120%; min-height: 12px; }
.t-17  { font-weight: 400; font-size: 17px; line-height: 120%; min-height: 12px; }
.t-13  { font-weight: 600; font-size: 13px; line-height: 120%; }  /* footer */

/* ══ Active Frame ══
   01. Zero carries no auto-layout: children sit at literal page coordinates,
   so the frame is a positioning context and every child is placed absolutely
   at its drawn x/y. */
/* The app column is 375 and the FOOTER BAND is not (the design director 2026-08-01,
   option 1). The constraint used to sit on `body`, so the white band ended
   with the app: at any window wider than 375 the column centred and theme
   background showed on BOTH sides of the band, which read as the footer
   stopping short. The column now lives on `main`, and `body` is free to be as
   wide as the window — so the band spans it while the five 75px tabs stay
   centred on 375 by the footer's own `justify-content: center`.
   Nothing drawn moves: `main` is the positioned ancestor on Home and Trips,
   so every absolute coordinate inside it is unchanged. */
/* SCROLLS when the board does not fit (the design director, 2026-08-02). The boards are drawn
   726 tall; on an installed iPhone the screen gives `main` 673 — 852 less the
   59pt status bar and a 120 footer (86 plus the 34pt home-indicator band). The
   zero state's card runs 611–708, so 35px of it was cut with no way to reach
   it. It used to fit only because Safari kept the layout OUT of the safe areas,
   which left `main` about 708 — luck, not design, and `viewport-fit=cover`
   spent it. Chosen over re-anchoring the card to the bottom, which squeezes its
   gap to the link from 64px to 11px, and over redrawing the board. Nothing
   drawn moves; a short screen simply scrolls. `overflow-x` stays hidden, so
   only the vertical axis opens. */
main { flex: 1; min-height: 0; position: relative;
  overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  width: 100%; max-width: 375px; margin-inline: auto; }
.state { display: none; position: absolute; inset: 0; }
.state.on { display: block; }
.state > * { position: absolute; }

/* ══ brand-svg — the castle (61:2992) ══
   The node is 454x360 at x=−46 and clips; figwright's export is already
   clipped to the 375 page, so it lands at x=0. */
.castle { left: 0; top: 1px; width: 375px; height: 360px; overflow: hidden; }

/* ══ icon-edit · setting-primary (83:3225) ══
   Instance box 55x55.84 at (320,0) with 20px top/right padding, so the glyph
   itself occupies (320,20)–(355,55.84). The export carries ~1px of stroke
   bleed on each side, hence the −1 / −0.58 origin nudge. */
/* The export's path coords already carry the glyph's position inside the
   instance — rules run x 1.5→34.5 at y 20 / 32 / 44 — so the origin is the
   instance box shifted left by the 1.5 stroke half-width, and NOT nudged
   vertically at all. Measured: rules land at exactly x 320..353 / 320..331,
   y 20 / 32 / 44, matching the board to 0.00px. */
.settings { left: 318.5px; top: 0; width: 57px; height: 57px; padding: 0; }
.settings svg { display: block; }

/* ══ "YOUR MAGICAL VACATION" wordmark (80:3153), outlined type ══ */
.wordmark { left: 28.307617px; top: 390.394531px; width: 320px; height: 85px; }

/* ══ start-planning link (61:3065) ══ */
/* --primary-text, not --primary: 17px on --bg fails AA in 11 of 16 themes,
   and option A keeps --primary at its drawn value wherever it is a FILL
   (the design director, 2026-07-28). In the 5 passing themes the token aliases --primary,
   so nothing moves there. */
/* 244x12 with 190px clear below — 44 tall, drawn text unmoved (2026-08-01). */
.start-link { position: relative; }
.start-link::after { content: ''; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); width: 100%; height: 44px; }
.start-link { left: 70px; top: 525px; width: 244px; text-align: center;
  color: var(--primary-text); text-decoration: underline; }

/* ══ cards · category=insights · type=days-with-disney (61:3071 / 61:3030) ══
   Outer box is placed in 01 and a stack item in 02/02a; the inside is genuine
   auto-layout (VERTICAL, padding 16/20, gap 12, primary MAX). */
.days-card { width: 335px; height: 97px;
  border-radius: var(--radius-compact-card); background: var(--surface);
  box-shadow: var(--shadow-card); overflow: hidden;
  padding: 16px 20px; display: flex; flex-direction: column;
  justify-content: flex-end; align-items: flex-start; gap: 12px; }
[data-state="zero"] .days-card { left: 20px; top: 611px; }
.days-card .title { color: var(--ink); }
.days-card .line  { color: var(--ink); }

/* ══════ 02. Active (61:2759) · 02a. Active-more trips (61:2811) ══════
   Frame 29 is one bottom-anchored auto-layout column (VERTICAL, padding
   32/0/20/0, gap 16, primary MAX, counter CENTER). Both states end it at
   y=730; only its height and card count differ, which is why 02 starts at
   321 and 02a at −5. */
.stack { width: 335px; display: flex; flex-direction: column;
  align-items: center; padding: 32px 0 20px; gap: 16px; }
/* Bottom-anchoring is an auto margin, not `justify-content: flex-end`: the
   two are identical while the cards fit, but a flex-end column that overflows
   pushes its FIRST card above the scroll origin, where nothing can reach it.
   The auto margin collapses to 0 the moment the content stops fitting. */
.stack > :first-child { margin-top: auto; }
/* And the cards must NOT shrink to fit: a flex item defaults to shrinking, so
   a third card silently squeezed all three instead of overflowing — every
   card clipped its own header (they carry `overflow: hidden`) and nothing
   scrolled, because there was nothing to scroll. */
.stack > * { flex: none; }
[data-state="02"]  .stack { left: 20px; top: 321px; height: 409px; }
/* Three or more upcoming trips is the case the board does not draw — `02a`
   draws exactly two cards and fills the page. The list SCROLLS (the design director,
   2026-07-28): a plain scroll, no card limit, and deliberately no "+2 more"
   affordance, because no such control is drawn anywhere. */
[data-state="02a"] .stack { left: 20px; top: -5px;  height: 735px;
  overflow-y: auto; overscroll-behavior: contain;
  /* A classic scrollbar would eat 15px of a 335px column that is drawn 335
     wide: the cards then centre-overflow their own container and the header's
     nowrap trip type runs under the edit pencil. The phone this ships to has
     overlay scrollbars and the board draws no scrollbar at all, so the gutter
     is removed rather than designed around. Keyboard access is unaffected —
     every card carries a focusable edit button, so tabbing scrolls the
     region. The cue that more exists is the cut-off card at the fold. */
  scrollbar-width: none; }
[data-state="02a"] .stack::-webkit-scrollbar { width: 0; height: 0; }
/* Cards MAY flow over the settings glyph — that is the drawn look and the design director
   keeps it — provided the user can PULL THEM LOWER to reach the control
   (the design director, 2026-07-28). The room is made inside the drawn box: 32 drawn gap +
   30 of pull, and the list opens scrolled PAST the pull (see markScrollable),
   so at rest card one sits at its drawn y=27 and the castle is covered exactly
   as the board covers it. Pulling down exposes the glyph; letting go leaves it
   exposed until the user scrolls back.
   THE 30 IS MEASURED, NOT CHOSEN. Three fixed edges decide it: card one is
   drawn at y=27, the settings glyph's box ends at y=57 (its ink at 55.84),
   and the castle's topmost ink — the flag tip — starts at y=57.93. Pulled
   fully down, card one lands at 57: the glyph is completely clear and the
   flag is still completely covered, with 0.9px to spare. A bigger pull
   exposes a SLICE of flag cut off by the card edge, which is exactly what a
   cropped castle looks like; a smaller one leaves the glyph part-hidden.
   Two earlier passes are recorded because both LOOKED reasonable and both cut
   the castle: moving the box to top:57 clipped the cards at that line and left
   the spire half-covered, and resting the stack 62px low put the card's top
   edge straight through the spire. A card edge anywhere inside the castle's
   tip reads as damage; only y=27 (drawn) or a full cover avoids it. */
[data-state="02a"] .stack.scrolls { padding-top: 62px; }
/* Revealing the glyph is not the same as being able to press it: the stack's
   own box spans the whole frame whatever the scroll position, so a tap on the
   exposed glyph was landing on transparent nothing. The box stops being a
   target; the cards inside it stay targets and still drive the scroll. Paint
   order is untouched — a card that is physically over the glyph still covers
   it, which is the behaviour the design director kept.
   Not scoped to `.scrolls`: this box swallowed the settings glyph in the
   DRAWN two-card state too (only its rightmost ~20px answered a tap), which
   is the defect logged from chunk 8's sweep. Nothing moves on screen — an
   empty transparent box simply stops intercepting. */
[data-state="02a"] .stack { pointer-events: none; }
[data-state="02a"] .stack > * { pointer-events: auto; }

/* cards · category=trips — booked-next-trip (61:2405) and
   booked-coming-up (61:2507). Home presents confirmed upcoming trips only;
   Planning remains a Trips-module concern. Both Home variants hide the
   component's forecast/budget line: Home never shows money (frozen). */
.card-trip { width: 335px; border-radius: var(--radius-card);
  background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden;
  display: flex; flex-direction: column;
  justify-content: flex-end; align-items: flex-start; padding-bottom: 16px; }
.card-next     { gap: 12px; }
.card-coming   { gap: 6px; }

.trip-head { align-self: stretch; display: flex; align-items: center;
  justify-content: space-between; padding: 12px 20px 6px; }
.card-next .trip-head { background: var(--header-bg); }
.trip-head .title { font-weight: 600; font-size: 19px; line-height: 135%;
  height: 12px;                        /* board pins this box to 12, not 14 */
  /* The label is derived copy, so it fills the remaining width without letting a
     long trip type must not shove the edit button — and nowrap keeps the
     header at its drawn 42. No `overflow: hidden` here: the box is pinned to
     12 while the glyphs are a 14 cap box, so clipping would shave the type. */
  flex: 1 1 auto; min-width: 0; white-space: nowrap; }
.card-next     .trip-head .title { color: var(--header-ink); }
.card-coming   .trip-head .title { color: var(--primary); }

/* icon-edit 24px — primary-white on the next-trip band and edit-primary on
   Coming Up. The board's drop shadow rides the CSS filter (dvc.html rule). */
.edit-btn { width: 24px; height: 24px; flex: none; padding: 0; }
/* 24x24 with 316px of clear space around it — full 44 costs nothing and
   moves nothing (the design director 2026-08-01). */
.edit-btn { position: relative; }
.edit-btn::after { content: ''; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); width: 44px; height: 44px; }
.mini-edit { width: 24px; height: 24px; flex: none; display: block;
  filter: drop-shadow(0 1px 1.5px rgba(30,30,30,0.10)); }
.card-next     .mini-edit { --pen-bg: var(--surface); --pen-ink: var(--primary); }
.card-coming   .mini-edit { --pen-bg: var(--primary); --pen-ink: var(--on-primary); }

.trip-body { align-self: stretch; display: flex; flex-direction: column;
  align-items: flex-start; gap: 16px; padding-left: 20px; }
.count-row { display: flex; align-items: flex-end; }   /* counter MAX */
.count, .count-unit, .trip-name { color: var(--primary); }
.card-next     .count { font-family: var(--font-count); font-weight: 800;
  font-size: 104.75px; line-height: 199.56883px; height: 74px; }
.card-coming   .count { font-weight: 700; font-size: 80px; line-height: 120%;
  height: 58px; }
.count-unit { font-weight: 600; font-size: 19px; line-height: 135%; height: 14px; }
.trip-name, .trip-dates { width: 308.380920px; }       /* board's fixed box */
.trip-dates { color: var(--ink); }

/* ══════ 03. Theme-update (83:3232) ══════
   `screen` is a transparent bottom-anchored column — radius 14 is authored on
   it but it carries no fill, so it reads as pure layout. Section is 336 wide
   inside a 319 content box, i.e. it overhangs 0.5px each side exactly as
   drawn; flex centring reproduces that without a magic number. */
/* 03. Settings (83:3232) / 03a. settings-synched (226:4262), read 2026-08-01.
   The screen moved up (256 -> 144.14) and grew (472 -> 550) to carry the new
   data-synch block; the synched state is 582, the extra 32 being Frame 55's
   20px plus one 12px gap. */
.screen { left: 20px; top: 144.1376953125px; width: 335px; height: 550px;
  border-radius: var(--radius-card);
  display: flex; flex-direction: column;
  /* TOP-anchored with a 12px rhythm, both read off the revised board: Section
     sits at screen-relative y=16, Frame 31 at 372 (Section ends 360, +12) and
     data-synch at 432 (Frame 31 ends 420, +12). The previous build was
     bottom-anchored with 36 of bottom padding and a 16 gap, which put the
     whole stack ~60px high once the sync block was added. */
  align-items: center; justify-content: flex-start;
  padding: 16px 8px; gap: 12px; }
/* connected: 550 -> 582, the extra 32 being Frame 55's 20 plus one 12 gap */
.screen.is-synced { height: 582px; }
.section { width: 336px; display: flex; flex-direction: column;
  align-items: flex-start; gap: 8px; }
.sub-title { width: 336px; min-height: 12px; text-align: center;
  color: var(--primary-text); font-weight: 600; font-size: 17px; line-height: 120%; }
.grid { width: 336px; display: grid; grid-template-columns: repeat(4, 78px);
  /* 4 down, 8 across — the board's grid carries gridRowGap 4 / gridColumnGap 8,
     and the build had 8 both ways, which made the block 12px taller than
     drawn (three row gaps). */
  row-gap: 4px; column-gap: 8px; }

/* pchip (83:3481) — 2px color/bg INSIDE stroke; the chosen variant swaps it
   for a 4px color/deco CENTRE stroke, which is 2px in + 2px out. */
.pchip { width: 78px; height: 78px; border-radius: var(--radius-chip);
  background: var(--surface); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; padding: 0 0 7px;
  box-shadow: inset 0 0 0 2px var(--bg); }
.pchip.on { box-shadow: inset 0 0 0 2px var(--deco), 0 0 0 2px var(--deco); }
.palette { width: 61.390625px; height: 46.0390625px; flex: none; display: block; }
.cname { width: 78px; height: 12px; text-align: center; color: var(--ink);
  font-weight: 400; font-size: 12px; line-height: 120%; }

/* cta-buttons — CANCEL `primary-outline` (59:1630) + SAVE `primary-filled`
   (51:358), both 115x48, 16px apart, the pair centred (Frame 31, 175:4527).
   Radius = half height. The outline's 1.5px stroke is INSIDE, so it rides an
   inset ring rather than a border (borders grow the box). */
.cta-row { display: flex; gap: 16px; }

/* ══ data-synch (226:4229 / 226:4231) ══════════════════════════════════════
   Two variants: not connected (Connect Google Drive) and connected (Synch Now
   + last-synced + Disconnect). Vertical, 16 above the rule, 12 between rows. */
.data-synch { width: 335px; display: flex; flex-direction: column;
  align-items: center; padding-top: 16px; gap: 12px; }
.rule-primary { width: 335px; height: 0; border-top: 1.5px solid var(--primary); }
.synch-title { width: 335px; text-align: center; color: var(--primary);
  font-weight: 600; font-size: 19px; line-height: 135%; }
/* This CTA HUGs its label — 138 for "Synch Now", 226 for "Connect Google
   Drive" — where the theme picker's pair are a fixed 115. */
.data-synch .cta { width: auto; }
.synch-meta { width: 335px; display: flex; flex-direction: column; gap: 8px; }
/* a class rule outranks the bare [hidden] default, so say it explicitly */
.synch-meta[hidden] { display: none; }
/* Manrope Regular 9/120%, read off I226:4397;226:4238 rather than guessed
   from the 6px instance height. */
.synch-line { width: 335px; text-align: center; color: var(--primary);
  font-weight: 400; font-size: 9px; line-height: 120%;
  /* .screen is a FIXED 550/582 read off the board, so a line that wraps does
     not grow the card — it breaks it. The confirm state puts the longest
     string this block ever holds here ("From iPhone · Safari · <date time>"),
     and a verbose locale could push it past 335. One line, always. */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.synch-line { display: block; }
/* Same trap as .synch-meta above, and it bit: a class rule carrying `display`
   outranks the UA's bare [hidden], so the Disconnect link stayed on screen in
   the disconnected state. Say it explicitly. */
button.synch-line[hidden] { display: none; }
.cta { width: 115px; height: 48px; flex: none; border-radius: 24px;
  background: var(--primary); color: var(--on-primary);
  display: flex; align-items: center; justify-content: center; padding: 0 24px; }
.cta--outline { background: var(--surface); color: var(--primary);
  box-shadow: inset 0 0 0 1.5px var(--primary); }

/* brand-svg 226:4473 — the SAME castle artwork, scaled: 207/369 = 0.561 and
   159/283 = 0.562, so the revised board re-crops rather than redraws it. No
   new asset is invented here. */
.castle-sm { left: 84px; top: 1.1376953125px; width: 207px; height: 159px; }

/* symbol library — never painted itself */
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ══ Footer · variant home ══ */
footer.footer { flex: none; height: var(--footer-h); background: var(--surface);
  border-top: 1.900338px solid var(--deco); display: flex; justify-content: center; }
.tab { position: relative; width: 75px; height: 83.901894px;
  display: block; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; border-radius: 8px; }
.tab .label { position: absolute; top: 60px; left: 0; right: 0; text-align: center; color: var(--ink); }
.tab.on .label { color: var(--primary); }
.tab svg { position: absolute; }
/* ══ iOS safe areas (the design director, 2026-08-02) ═══════════════════════════════════
   Reported on the live beta: a yellow strip under the footer, on every
   screen. Without `viewport-fit=cover` Safari keeps the layout OUT of the
   safe areas and paints them with the html background — which is the theme
   colour, so the home-indicator band read as the footer stopping short.
   Cover hands the layout those bands; `padding-top` on body puts the
   content back exactly where it sat before, and the footer's own white now
   reaches the physical bottom edge. Nothing drawn moves — where there is no
   inset (every desktop browser, and any phone without an indicator) both
   values resolve to 0, so this is inert off iOS. */
body { padding-top: env(safe-area-inset-top, 0px); }
footer.footer {
  height: calc(var(--footer-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
</style>

<script type="module">
/* ══════════════ Home — state selection, derivation, theme picker ══════════
   Home holds no inputs, writes nothing and never shows money. Everything on
   screen is derived from the stored trip list, read once at boot (chunk 8).
   Home is a READER: it creates no trip and edits none. Both outbound paths
   hand off — the Zero link to Trips, a card's pencil to `trips.html?edit=`,
   because Trips owns the form (frozen 2026-07-27).
   ─────────────────────────────────────────────────────────────────────── */

import { openIdb }   from './js/storage/adapter-idb.js';
import { createRepo } from './js/storage/repo.js';
import { deriveInsights } from './js/insights-derive.js';
import { tripTypeOf } from './js/trip-type.js';

const DAY = 86400000;
const iso = ms => new Date(ms).toISOString().slice(0, 10);
const at  = d  => Date.parse(d + 'T00:00:00Z');
const now = new Date();
const T0 = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());   // today, UTC-normalised
const TODAY = iso(T0);

/* ── real reads (chunk 8) ───────────────────────────────────────────────
   The only storage call on this screen, and it is a read. No storage means
   an empty list, which renders Zero — the honest reading, never a crash. */
let stored = [];
let db = null;                     /* kept: the Drive bridge snapshots it whole */
try {
  db = await openIdb();
  stored = await createRepo(db).listTrips();
} catch (e) {
  console.error('Home: storage unavailable —', e);
}
/* Both dates, or the row cannot be put on a countdown or in a calendar year.
   Trips filters its own card stack the same way. */
const trips = stored.filter(t => t.start_date && t.end_date);

/* dev harness — ?state=zero|02|02a|03 · ?trips=<n> · ?theme=<id>
   `trips` only ever SHORTENS the real upcoming list; it cannot invent a row. */
const q = new URLSearchParams(location.search);

/* ── derivation ─────────────────────────────────────────────────────────
   Trip Type is derived from the component flags (DATA-MODEL §1: there is no
   trip_type column, "label logic lives in the app") and the vocabulary lives
   in js/trip-type.js, shared with Trips. Home used to keep its own copy that
   concatenated with " & "; it disagreed with Trips on four of the eight
   combinations, so the copy is gone rather than corrected. */
const typeLabel = tripTypeOf;
const nights   = t => Math.round((at(t.end_date) - at(t.start_date)) / DAY);
const tripDays = t => nights(t) + 1;                    /* HOME-BUILD: nights + trip count */
const countdown = t => Math.ceil((at(t.start_date) - T0) / DAY);
const usDate = d => { const [y, m, dd] = d.split('-'); return `${m}/${dd}/${y}`; };

/* Home is a confirmed-trip dashboard: earliest confirmed upcoming trip is
   Next Trip; every later confirmed trip is Coming Up. Planning belongs in
   Trips until confirmation. With no confirmed upcoming trip, Home is Zero.
   The list is NOT truncated — three or more scroll (the design director, 2026-07-28).
   ⚠ Undrawn: the board draws one Coming Up card, so cards 3+ repeat that
   heading. No other wording exists to use, and inventing one is not Claude's
   call — logged in TODO.md for the design director. */
const booked   = trips.filter(t => t.status === 'booked');
const byStart  = (a, b) => at(a.start_date) - at(b.start_date);
let upcoming = booked
  .filter(t => at(t.start_date) >= T0)
  .sort(byStart)
  .map((t, i) => ({ trip: t, kind: i === 0 ? 'next' : 'coming' }));
if (q.get('trips') !== null) upcoming = upcoming.slice(0, +q.get('trips'));

/* Magical days — one card, two lines, both derived.

   "Planned this year" is BOOKED TRIPS STARTING IN THE CURRENT CALENDAR YEAR
   and was deliberately NOT redefined (the design director, 2026-07-28), so it stands as
   built and is not "fixed" to match the line below it.

   "Tracked all time" is EVERYTHING TRACKED WITH THE APP — the same population
   as the Insights all-time figure, which is a change: this line used to read
   `trips already finished`, so a booked-but-unfinished trip was missing from
   it. The two surfaces have to agree by construction, so Home asks
   deriveInsights rather than re-filtering: `tripCount` is Insights' own
   number, and the days are summed over the very trips Insights counted.
   Nothing but trips is passed, and nothing but the population is taken from
   it — Home shows no money, ever.
   The `+ 1` is Home's UNIT, not a second opinion about the population: a
   Home "day" is `nights + 1` (HOME-BUILD), while insights-derive counts
   nights. Applying it here keeps both lines of this card in one unit. */
const ins = deriveInsights({ trips, today: TODAY });
const trackedCards = ins.years.flatMap(y => y.trips);
const trackedAll = { d: trackedCards.reduce((s, c) => s + c.days + 1, 0),
                     n: ins.allTime.tripCount };

const yr = new Date(T0).getUTCFullYear();
const tally = list => ({ d: list.reduce((s, t) => s + tripDays(t), 0), n: list.length });
const plannedYear = tally(booked.filter(t =>
  at(t.start_date) >= Date.UTC(yr, 0, 1) && at(t.start_date) < Date.UTC(yr + 1, 0, 1)));

/* ── render ─────────────────────────────────────────────────────────────
   Unit words stay singular ("0 Day / 0 Trip") because that is what the board
   draws; pluralisation is copy, and copy is the design director's. */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const daysCardHTML = () => `
  <div class="days-card">
    <div class="title t-h1 txt">All your magical days</div>
    <div class="line l1 t-17 txt"></div>
    <div class="line l2 t-17 txt"></div>
  </div>`;

const HEAD = { next: 'Next Trip', coming: 'Coming Up' };

/* `title` is the field Trips writes, so it is the one Home reads; a row saved
   without one is named rather than left blank, exactly as the Trips stack
   names it. */
const nameOf = t => t.title || 'Untitled trip';

const tripCardHTML = ({ trip: t, kind }) => `
  <article class="card-trip card-${kind}">
    <div class="trip-head">
      <div class="title txt">${HEAD[kind]} : ${esc(typeLabel(t))}</div>
      <button class="edit-btn" type="button" data-edit-trip="${esc(t.id)}" aria-label="Edit ${esc(nameOf(t))}">
        <svg class="mini-edit" viewBox="0 0 24 24" aria-hidden="true"><use href="#pencil"/></svg>
      </button>
    </div>
    <div class="trip-body">
      <div class="count-row">
        <span class="count txt">${countdown(t)}</span>
        <span class="count-unit txt">days until</span>
      </div>
      <div class="trip-name t-17b txt">${esc(nameOf(t))}</div>
      <div class="trip-dates t-17 txt">from ${usDate(t.start_date)} to ${usDate(t.end_date)}</div>
    </div>
  </article>`;

document.querySelector('[data-stack="02"]').innerHTML =
  (upcoming[0] ? tripCardHTML(upcoming[0]) : '') + daysCardHTML();
/* No `.slice(0, 2)`: the whole upcoming list renders and the stack scrolls. */
document.querySelector('[data-stack="02a"]').innerHTML =
  upcoming.map(tripCardHTML).join('') + daysCardHTML();

document.querySelectorAll('.days-card').forEach(card => {
  card.querySelector('.l1').textContent = `Planned this year: ${plannedYear.d} Day / ${plannedYear.n} Trip`;
  card.querySelector('.l2').textContent = `Tracked all time: ${trackedAll.d} Day / ${trackedAll.n} Trip`;
});

/* ── theme picker (state 03) ────────────────────────────────────────────
   The five swatches are the ORIGINAL palette colours, before calibration,
   used as-is (the design director, 2026-07-26) — so they are literal hexes read off the
   board and never move with the active theme. The screen around them does:
   tapping a chip repaints the app in that theme's calibrated tokens straight
   away, SAVE keeps it, CANCEL puts the entry theme back. */
const THEMES = [
  ['apple',  'Apple', '#0A64A5','#DE2C47','#8AC0E5','#FFCA35','#FFEB94'],
  ['sky', 'Sky', '#286287','#3B8BBD','#8CC5E8','#B1DEF5','#D7EAF6'],
  ['meadow', 'Meadow', '#45767B','#758B42','#C5D163','#DFE46E','#CBEAFE'],
  ['rose',     'Rose',     '#D2487A','#E387B8','#E5AFCF','#F8CB49','#DCE5E8'],
  ['lagoon',      'Lagoon',      '#594597','#378D68','#A497C4','#53B288','#C6E8BE'],
  ['gold',      'Gold',      '#F0BE4D','#F8D562','#F7E4A6','#FFE67F','#FEEFB5'],
  ['oasis',    'Oasis',    '#16A39E','#65C5C8','#96D8E1','#FCD53B','#BCEBE4'],
  ['canyon', 'Canyon', '#C74E28','#488D91','#DA9740','#F7CB6C','#F9E0AB'],
  ['crimson',      'Crimson',      '#314E88','#7C404A','#69A997','#BFD38E','#FAEF95'],
  ['olive',      'Olive',      '#769A8C','#8AAC66','#BDD395','#DAE4C7','#F8F3CD'],
  ['lavender',   'Lavender',   '#8550A0','#A06BAF','#9C8CBD','#DAAFD2','#FADEE4'],
  ['highland',     'Highland',     '#305B75','#071720','#173442','#6C3B27','#E6CCAD'],
  ['glacier',       'Glacier',       '#0C77A8','#3ABAE3','#86B3CB','#82D4ED','#D5D9EA'],
  ['heather',       'Heather',       '#050A0A','#1E1A62','#1D318B','#A42384','#7DBBB0'],
  ['coral',      'Coral',      '#3F201B','#D7473A','#6EC9DA','#E0B896','#FFECD4'],
  ['jade',       'Jade',       '#234F59','#2D6F73','#5A8F79','#8CB9B0','#D9ECE8'],
];

const grid = document.querySelector('.grid');
grid.innerHTML = THEMES.map(([id, name, ...s]) => `
  <button class="pchip" type="button" role="radio" aria-checked="false" data-theme-id="${id}"
          style="--s1:${s[0]};--s2:${s[1]};--s3:${s[2]};--s4:${s[3]};--s5:${s[4]}">
    <svg class="palette" viewBox="0 0 61.390625 46.0390625" aria-hidden="true"><use href="#palette"/></svg>
    <span class="cname txt">${name}</span>
  </button>`).join('');

let committed = Theme.current();   /* the theme to fall back to on CANCEL */
let pick = committed;
function apply(id) { pick = id; Theme.apply(id); markPick(); }   /* preview only — no write */
function markPick() {
  grid.querySelectorAll('.pchip').forEach(c => {
    const on = c.dataset.themeId === pick;
    c.classList.toggle('on', on);
    c.setAttribute('aria-checked', String(on));
  });
}
grid.addEventListener('click', e => {
  const chip = e.target.closest('.pchip');
  if (chip) apply(chip.dataset.themeId);       /* live preview, not a commit */
});

/* ── state switching ────────────────────────────────────────────────────
   Transitions are a plain re-render; motion is Interaction-Pass work. */
const states = [...document.querySelectorAll('.state')];
function show(id) { states.forEach(s => s.classList.toggle('on', s.dataset.state === id)); }

const dataState = upcoming.length === 0 ? 'zero' : upcoming.length === 1 ? '02' : '02a';
let back = dataState;

document.querySelectorAll('[data-open-theme]').forEach(b => b.addEventListener('click', () => {
  back = document.querySelector('.state.on').dataset.state;
  committed = Theme.current();
  apply(committed);
  show('03');
}));
document.querySelector('[data-save-theme]').addEventListener('click', () => {
  committed = pick;
  Theme.save(pick);        /* the one write: persists to localStorage, survives reload */
  show(back);
});
document.querySelector('[data-cancel-theme]').addEventListener('click', () => {
  apply(committed);        /* undo the live preview */
  show(back);
});

/* dev harness override — previews a theme without committing it to storage */
if (q.get('theme')) { committed = q.get('theme'); Theme.apply(committed); pick = committed; }
else { committed = Theme.current(); pick = committed; }
/* Home never edits a trip itself — it hands the id to Trips, which owns the
   form. Trips reads the id behind ?edit= and opens that row. */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-edit-trip]');
  if (b) location.href = 'trips.html?edit=' + encodeURIComponent(b.dataset.editTrip);
});

/* The overflow hides the DAYS CARD, and nothing below the last edit button is
   focusable — so tabbing through the cards never scrolls it into view and a
   keyboard-only user cannot read "Tracked all time". Making the region itself
   focusable is the standard remedy (axe `scrollable-region-focusable`): arrow
   keys then drive the scroller directly.
   Only WHEN it actually overflows, so the drawn one- and two-card cases gain
   no tab stop they were never drawn with. Must run after show(): a
   `display: none` state measures 0 and would never qualify.
   ⚠ Verified by measurement: wheel/touch scrolling, the overflow itself, and
   the conditional attributes. NOT verified here: the arrow-key scroll — this
   session's browser tool cannot dispatch a key event that triggers a default
   scroll action (a plain focused `overflow:auto` control div ignored it too),
   so that half rests on standard behaviour, not on a measurement. */
const PULL = 30;   /* must match the .scrolls padding-top above, less the drawn 32 */
function markScrollable() {
  const el = document.querySelector('[data-stack="02a"]');
  const scrolls = el.scrollHeight > el.clientHeight + 1;
  el.classList.toggle('scrolls', scrolls);   /* opens the pull-down room above card one */
  /* Open PAST that room, so the list rests where the board draws it and the
     62px is somewhere to pull rather than a gap the user has to look at. */
  if (scrolls) el.scrollTop = PULL;
  el.toggleAttribute('tabindex', scrolls);
  if (scrolls) {
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', 'Upcoming trips');
  } else {
    el.removeAttribute('role');
    el.removeAttribute('aria-label');
  }
}

markPick();
show(q.get('state') || dataState);
markScrollable();

/* ═══════════ Data synch — the Google Drive bridge (2026-08-03) ═══════════
   Drive is a BRIDGE BETWEEN THE USER'S OWN DEVICES, not a synchroniser. The
   user decides when to hand the data over; both directions replace
   everything, because that is what handing a folder over means.

   ⚠ Nothing here touches the network on boot — no token, no Google script,
   not even a DNS lookup — until the user taps Connect. That is what keeps
   operating rule 1 ("no normal path may read or write a remote") literally
   true for everyone who never turns sync on.
   ─────────────────────────────────────────────────────────────────────── */
import { createPrefs, KEYS }  from './js/sync/prefs.js';
import { isConfigured }       from './js/sync/drive-config.js';
import { createDriveAppData } from './js/sync/drive-appdata.js';
import { createSync }         from './js/sync/sync.js';
import * as drive             from './js/sync/google-auth.js';

const prefs    = createPrefs();
const elScreen = document.querySelector('.screen');
const elTitle  = document.querySelector('[data-synch-title]');
const elCta    = document.querySelector('[data-drive-toggle]');
const elLabel  = document.querySelector('[data-drive-label]');
const elMeta   = document.querySelector('[data-synch-meta]');
const elLine   = document.querySelector('[data-last-synced]');
const elOff    = document.querySelector('[data-drive-disconnect]');

/* The status line is the only channel this block has — announce it. */
elLine.setAttribute('role', 'status');

const sync = createSync({
  db, prefs,
  /* A fresh token per operation. The GIS token is short-lived and one can
     expire between the comparison and the upload the user then confirms. */
  getDrive: async () => createDriveAppData({
    accessToken: await drive.ensureToken(prefs, { interactive: true }),
  }),
});

const stamp = iso => {
  const t = Date.parse(iso ?? '');
  return Number.isNaN(t) ? '—' : new Date(t).toLocaleString();
};

let pending = null;   /* the confirm in flight — { verdict, remote } */
let note    = null;   /* one-shot line, replaces the timestamp when set */
let busy    = false;

/* Three states in the SAME three drawn rows — no dialog, no new component. */
function render() {
  const connected = drive.isConnected(prefs);
  elScreen.classList.toggle('is-synced', connected || Boolean(pending));

  if (pending) {
    const down = pending.verdict === 'cloud-newer';
    elTitle.textContent = down ? 'A newer backup is available.' : 'Upload local data?';
    elLabel.textContent = down ? 'DOWNLOAD' : 'UPLOAD';
    /* Names the other device and the other time. Because both directions are
       destructive by design, the app's job is to show what is about to be
       replaced, not to prevent it (frozen 2026-08-01) — so this line carries
       the fact the question actually turns on. */
    elLine.textContent = note ?? (down
      ? `From ${pending.remote.deviceName || 'another device'} · ${stamp(pending.remote.backupTime)}`
      : `Replaces the backup from ${stamp(pending.remote?.backupTime)}`);
    elMeta.hidden = false;
    elOff.hidden = false;
    elOff.textContent = 'Cancel';
    return;
  }

  elTitle.textContent = 'Synch your data';
  elLabel.textContent = connected ? 'Sync Now' : 'Connect Google Drive';
  elLine.textContent  = note ?? `Last synced: ${stamp(prefs.get(KEYS.lastSynced))}`;
  elOff.textContent   = 'Disconnect Google Drive';
  elOff.hidden = !connected;
  elMeta.hidden = !connected && !note;
}

async function run(label, fn) {
  if (busy) return;
  busy = true; note = null;
  elCta.disabled = true;
  elCta.setAttribute('aria-busy', 'true');
  elLabel.textContent = label;
  try {
    await fn();
  } catch (e) {
    console.error('Drive sync —', e);
    /* Google's own wording where it is useful, trimmed so it cannot break the
       9px line. A failed sync leaves BOTH copies untouched. */
    note = (e?.message || 'Something went wrong.').slice(0, 90);
  }
  busy = false;
  elCta.disabled = false;
  elCta.removeAttribute('aria-busy');
  render();
}

/* Compare, then either act or ask. Nothing is written before the answer. */
async function syncNow() {
  const { remote, verdict } = await sync.inspect();
  if (verdict === 'upload-first') {          /* nothing there yet — just put it down */
    await sync.push(null);
    note = 'Backed up to Google Drive.';
    return;
  }
  pending = { verdict, remote };
}

elCta.addEventListener('click', () => {
  if (pending) {
    const { verdict, remote } = pending;
    const down = verdict === 'cloud-newer';
    return run(down ? 'Downloading…' : 'Uploading…', async () => {
      if (down) {
        await sync.pull(remote);
        /* Every screen reads storage once at boot and holds what it derived in
           module scope; there is no store-wide invalidation path, and building
           one to serve a rare, deliberate, user-initiated replacement would be
           the larger change. A reload is honest and total. */
        location.reload();
        return;
      }
      await sync.push(remote);
      pending = null;
      note = 'Uploaded to Google Drive.';
    });
  }

  if (!drive.isConnected(prefs))
    return run('Connecting…', async () => { await drive.connect(prefs); await syncNow(); });

  return run('Checking…', syncNow);
});

/* One button, two meanings — Cancel while a confirm is open, Disconnect
   otherwise. Cancel writes nothing, locally or remotely. Disconnect drops the
   credentials and NEVER the Drive file. */
elOff.addEventListener('click', () => {
  if (busy) return;
  if (pending) { pending = null; note = null; render(); return; }
  drive.disconnect(prefs);
  note = null;
  render();
});

/* No client id means the feature is not set up yet — say so, rather than
   offering a button that looks live and throws. */
if (!isConfigured()) {
  elCta.disabled = true;
  note = 'Google Drive is not configured yet.';
}
render();
</script>

</body>
</html>
