<!DOCTYPE html>
<!--
  Start — the entry gate. Visual truth: Figma Start section 5:5480, read via
  figwright 2026-08-02.

  Frames:
    Start / Spec              58:6946
    01. Zero                  5:2       ← built (nothing chosen yet)
    02. User Selects Theme    92:3751   ← built (a chip carries the ring)

  WHY THIS FILE IS index.html
  The design director, 2026-08-02: "it must show on every app start", not only the
  first. That is an ENTRY-POINT rule, not a screen rule, so Start took the
  root and the old index.html (Home) moved to home.html. The three ways in
  now all land here: the bare Pages URL, a shared link, and the installed
  PWA's launch (`start_url: ./index.html`, unchanged — it resolves to this
  file now). The five footers' Home tab points at home.html, so tapping Home
  inside the app never re-opens the gate. That was the whole point of moving
  the file rather than adding a redirect.

  TRANSLATION NOTE — like Home, this frame carries no auto-layout at the top
  level: brand-svg, screen, cta and finehint sit at literal 375x812 page
  coordinates. Inside `screen` the design IS auto-layout (Section 232:6216
  and its 4x4 grid), so the inside is built the usual flex way.

  THE BRAND BAND IS 375 WIDE, AND THE 611 IS THE ARTBOARD
  Worth being exact, because the two numbers invite the wrong build. The
  `brand-svg` FRAME is 611x248 sitting at x=-118 on a 375 page, so the art
  bleeds 118px past each edge — but the page clips it, and what is DRAWN is
  375 wide. The design director's export says so directly: it is a 375x248
  canvas whose paths run -120.9 to 483.9, with the frame's own clip preserved
  as `#clip-brand` (a 611 rect translated -118). So the band is an ordinary
  child of `main`, at 0,0, and the <svg> viewBox does the cropping the page
  does in Figma. Nothing needs to escape the column.

  SHARED WITH HOME, NOT RE-DERIVED
  This screen is the OTHER writer of the `dt-theme` key, so it goes through
  js/theme.js exactly as Home's Settings state does — same key, same 16 ids,
  same validation. The chip component is the same main component as Home's
  (226:4482), so .pchip / .grid / .sub-title / .cta are Home's rules verbatim
  and the 16 swatch palettes are the same literal hexes, for the same reason
  Home records: a picker must show each theme's own colours, so the chips
  cannot be painted in tokens.

  ONE BOARD DIFFERENCE FROM HOME, REPORTED NOT SILENT
  Home's `.sub-title` renders `--primary-text` (the 2026-07-28 AA option-A
  token). The Start board binds its sub-title to the SAME variable as the
  fine print, which resolves to ink, so "Pick your theme" is `--ink` here.
  Both clear AA on `--bg`; the two boards simply differ. Flagged in TODO.

  THE BANNER ART — the design director's export, recoloured, nothing redrawn
  `#brand-castle` is her SVG export of the brand-svg frame (asset/exports/
  brand-svg.svg), spliced in with each layer's literal fill swapped for the
  token it is bound to on the board:
    sky      white    -> --surface
    twinkles #FFCA35  -> --deco      (also class="twinkles" — the fade)
    castle   #DE2C47  -> --primary
    clouds   #FFF6CF  -> --bg
    wordmark #B48500  -> --accent    (10 letterform paths, grouped)
  Every layer's width matches the frame read exactly — 604.8 / 388.2 / 133.8
  / 270.0 — so the art is the uncropped original and no geometry was touched.
  Only the clipPath id was renamed (clip0_232_6202 -> clip-brand) so it cannot
  collide inside a shared document.

  THE WORDMARK'S COLOUR IS THE SEMANTIC ACCENT (the design director, 2026-08-02)
  Confirmed, not inferred: the wordmark rides `--accent`. START-SPEC v2's "JS
  --brand-dark (>=3:1 guard)" is superseded — there is no `--brand-dark` token
  and no runtime guard to write, because `--accent` is already the token the
  2026-07-28 AA sweep retoned in all 16 themes to stay legible on the theme's
  own light grounds. The guard is a token contract, not maths at load time.

  MEASURED, and the ground is not the one the layer order suggests: the
  wordmark sits at y 184..243 and the CLOUDS layer starts at y 108.5, so it
  paints on `--bg`, not on the white sky. Against --bg the worst of the 16 is
  **highland at 3.79:1**, and none falls below 3:1. That is the correct bar
  here — 59px display letterforms are large text, and the art is aria-hidden
  behind a real <h1>, so it is not carrying the name for a screen reader.
  Apple's wordmark goes #B48500 -> #9B6D00, slightly darker.
-->

     (the design director, 2026-08-02), so the app makes no third-party request at all. -->
<link rel="stylesheet" href="css/theme.css">
<!-- classic + blocking on purpose: sets <html data-theme> before first paint -->
<script src="js/theme.js"></script>
<style>
/* ══ Theme tokens live in css/theme.css — ONE copy for all six screens ══ */

:root {
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius-chip: 20px;                 /* pchip — unbound 20 on the board */
  --brand-h: 248px;                    /* brand-svg 5:6, drawn height */
  --col: 335px;                        /* content column, 375 − 20 − 20 */
}

/* ══ Base — identical to the other five screens ══ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--bg); }
body { font-family: var(--font); background: var(--bg); color: var(--ink);
  width: 100%; overflow-x: clip;
  padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; background: none; border: 0; cursor: pointer; color: inherit; display: block; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.txt { text-box: trim-both cap alphabetic; }

/* ══ brand-svg 5:6 — 375x248 at 0,0 ══
   The 611 artboard bleeds 118px past each page edge and the page clips it;
   the export carries that clip as #clip-brand, so the drawn band is simply
   375 wide and needs no full-bleed trick. */
.brand { position: absolute; left: 0; top: 0;
  width: 375px; height: var(--brand-h); pointer-events: none; }
.brand-art { display: block; width: 100%; height: 100%; }

/* The reveal (the design director, 2026-08-02): a RESTRAINED TWINKLE FADE-IN, per
   START-SPEC v2. The 2026-08-02 board's "pixie-dust reveal" wording was not
   taken — pixie dust is frozen as Spend's save-success moment, the app's one
   magical moment, and operating rule 6 keeps a still-valid freeze ahead of a
   board that drifted from it. Only the twinkle layer animates; the castle,
   clouds and wordmark are simply there.
   No [data-motion-safe] opt-out: theme.css's blanket rule collapses this to
   .01ms under prefers-reduced-motion, which for a fade means the twinkles are
   just present — the correct degradation, not a missing alternative. */
.brand-art .twinkles { animation: twinkle-in 900ms ease-out both; }
@keyframes twinkle-in { from { opacity: 0 } to { opacity: 1 } }

/* ══ The app column ══
   375 and centred, matching the five screens. Children sit at their drawn
   page coordinates, so the column is the positioning context. */
main { position: relative; width: 100%; max-width: 375px; margin-inline: auto;
  height: 812px; overflow-x: clip; }

/* ══ screen 5:5 — 375x493 at y=279 ══ */
.screen { position: absolute; left: 0; top: 279px; width: 375px; height: 493px; }

/* Section 232:6216 — 336x344 at x=19.5, auto-layout, 8px gap.
   sub-title (12) + gap (8) = the grid's drawn y=20. */
.section { position: absolute; left: 19.5px; top: 0; width: 336px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.sub-title { width: 336px; min-height: 12px; text-align: center;
  color: var(--ink); font-weight: 600; font-size: 17px; line-height: 120%; }
/* 4 down, 8 across — gridRowGap 4 / gridColumnGap 8, the same values Home's
   grid was corrected to on 2026-08-01. 4*78 + 3*8 = 336, 4*78 + 3*4 = 324. */
.grid { width: 336px; display: grid; grid-template-columns: repeat(4, 78px);
  row-gap: 4px; column-gap: 8px; }

/* pchip (83:3481) — 2px color/bg INSIDE stroke; the chosen variant swaps it
   for a 4px color/deco CENTRE stroke, which is 2px in + 2px out.
   Verbatim from Home: the same main component, so the same rule. */
.pchip { width: 78px; height: 78px; border-radius: var(--radius-chip);
  background: var(--surface); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; padding: 0 0 7px;
  box-shadow: inset 0 0 0 2px var(--bg); }
.pchip.on { box-shadow: inset 0 0 0 2px var(--deco), 0 0 0 2px var(--deco); }
.palette { width: 61.390625px; height: 46.0390625px; flex: none; display: block; }
.cname { width: 78px; height: 12px; text-align: center; color: var(--ink);
  font-weight: 400; font-size: 12px; line-height: 120%; }

/* cta-buttons 61:3139 — primary-filled, 102x48 at x=136.5 y=376, centred.
   102 = the 54px ENTER label + the bound 24px padding twice. Radius = half
   height, as on every other CTA in the app. */
.cta { position: absolute; left: 136.5px; top: 376px;
  width: 102px; height: 48px; border-radius: 24px;
  background: var(--primary); color: var(--on-primary);
  display: flex; align-items: center; justify-content: center; padding: 0 24px;
  font-weight: 600; font-size: 17px; line-height: 120%; white-space: nowrap; }

/* finehint 5:163 — 335x37 at x=20 y=456, 12/400/120%, centred.
   The board's third sentence ("Read [file name] for full privacy statement.")
   is NOT rendered: [file name] is an unresolved placeholder and the public
   repo carries no privacy document, so shipping it would be either a dead
   link or an invented one. Ruled by the design director 2026-08-02 — restore the
   sentence when the document exists. */
.finehint { position: absolute; left: 20px; top: 456px; width: var(--col);
  text-align: center; color: var(--ink);
  font-weight: 400; font-size: 12px; line-height: 120%; }

/* The privacy link (the design director, 2026-08-02). The board drew this sentence as
   PLAIN TEXT — "Read [file name] for full privacy statement" — with a
   placeholder that never resolved, so the build shipped without it. There is a
   document to point at now (the repo README), and her ruling is that a privacy
   notice you cannot reach is not a notice: on a phone, plain text naming a file
   is unusable. So it is a real link, and that is the one thing here the board
   does not draw — a board amendment is owed for the underline.
   ⚠ It leaves the app. `rel="noopener noreferrer"` because `target="_blank"`
   without it hands the opened page a handle back to this one.
   The 44px hit area comes from an ::after overlay rather than padding, so the
   drawn 12px line and the sentence's wrap are untouched — the same trick DVC's
   stay-picker and Insights' dots already use. It is wider than tall for the
   same reason the Trips check-lines are: the line box is what there is. */
.fineline { color: var(--ink); text-decoration: underline;
  text-underline-offset: 2px; position: relative; }
.fineline::after { content: ""; position: absolute; left: -8px; right: -8px;
  top: 50%; height: 44px; transform: translateY(-50%); }

/* symbol library — never painted itself */
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Screen-reader-only: the page needs a real <h1>, and the board draws the
   app's name as artwork inside the banner rather than as text. */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
</style>
</head>

<main>
  <h1 class="sr-only">WonderPlan</h1>

  <div class="brand" aria-hidden="true">
    <svg class="brand-art" viewBox="0 0 375 248"><use href="#brand-castle"/></svg>
  </div>

  <section class="screen">
    <div class="section">
      <p class="sub-title txt">Pick your theme</p>
      <div class="grid" role="radiogroup" aria-label="Theme"></div>
    </div>

    <button class="cta txt" type="button" data-enter>ENTER</button>

    <p class="finehint txt">For personal use only. This app does not collect any
      information from you.
      <!-- Repointed 2026-08-03 from the README anchor to privacy.html. Google's
           OAuth verification requires the privacy policy to sit on the domain
           hosting the homepage, and requires this link to match the one given on
           the consent screen. github.com satisfies neither — that domain belongs
           to GitHub and cannot be verified by this project. Same-origin now, so
           it opens in place rather than a new tab. -->
      <a class="fineline" href="./privacy.html">Read the privacy statement</a>
      for details.</p>
  </section>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   The 16 palettes, as literal hexes — the same list, in the same order, as
   Home's Settings grid. Painting these in tokens would repaint every chip
   whenever the active theme changed, and a picker has to show each theme its
   own colours. Order is the board's reading order, which is NOT theme.js's
   validation order; theme.js owns which ids are legal, this owns how they
   are laid out.
   ═══════════════════════════════════════════════════════════════════════ */
const THEMES = [
  ['apple',    'Apple',    '#0A64A5','#DE2C47','#8AC0E5','#FFCA35','#FFEB94'],
  ['sky',      'Sky',      '#286287','#3B8BBD','#8CC5E8','#B1DEF5','#D7EAF6'],
  ['meadow',   'Meadow',   '#45767B','#758B42','#C5D163','#DFE46E','#CBEAFE'],
  ['rose',     'Rose',     '#D2487A','#E387B8','#E5AFCF','#F8CB49','#DCE5E8'],
  ['lagoon',   'Lagoon',   '#594597','#378D68','#A497C4','#53B288','#C6E8BE'],
  ['gold',     'Gold',     '#F0BE4D','#F8D562','#F7E4A6','#FFE67F','#FEEFB5'],
  ['oasis',    'Oasis',    '#16A39E','#65C5C8','#96D8E1','#FCD53B','#BCEBE4'],
  ['canyon',   'Canyon',   '#C74E28','#488D91','#DA9740','#F7CB6C','#F9E0AB'],
  ['crimson',  'Crimson',  '#314E88','#7C404A','#69A997','#BFD38E','#FAEF95'],
  ['olive',    'Olive',    '#769A8C','#8AAC66','#BDD395','#DAE4C7','#F8F3CD'],
  ['lavender', 'Lavender', '#8550A0','#A06BAF','#9C8CBD','#DAAFD2','#FADEE4'],
  ['highland', 'Highland', '#305B75','#071720','#173442','#6C3B27','#E6CCAD'],
  ['glacier',  'Glacier',  '#0C77A8','#3ABAE3','#86B3CB','#82D4ED','#D5D9EA'],
  ['heather',  'Heather',  '#050A0A','#1E1A62','#1D318B','#A42384','#7DBBB0'],
  ['coral',    'Coral',    '#3F201B','#D7473A','#6EC9DA','#E0B896','#FFECD4'],
  ['jade',     'Jade',     '#234F59','#2D6F73','#5A8F79','#8CB9B0','#D9ECE8'],
];

const grid = document.querySelector('.grid');
grid.innerHTML = THEMES.map(([id, name, ...s]) => `
  <button class="pchip" type="button" role="radio" aria-checked="false" data-theme-id="${id}"
          style="--s1:${s[0]};--s2:${s[1]};--s3:${s[2]};--s4:${s[3]};--s5:${s[4]}">
    <svg class="palette" viewBox="0 0 61.390625 46.0390625" aria-hidden="true"><use href="#palette"/></svg>
    <span class="cname txt">${name}</span>
  </button>`).join('');

/* Theme.current() is the stored theme, or the 'apple' default on a first
   visit — which is what the board's 01. Zero is painted in. The ring is shown
   from the start rather than only after a tap: on every launch after the
   first the app already HAS a theme, and drawing no ring would say otherwise.
   01. Zero draws no ring because on a first visit nothing has been chosen;
   the two frames are the same rule seen at two moments. */
let pick = Theme.current();

function apply(id) { pick = id; Theme.apply(id); markPick(); }   /* preview only — no write */
function markPick() {
  grid.querySelectorAll('.pchip').forEach(c => {
    const on = c.dataset.themeId === pick;
    c.classList.toggle('on', on);
    c.setAttribute('aria-checked', String(on));
  });
}
markPick();

grid.addEventListener('click', e => {
  const chip = e.target.closest('.pchip');
  if (chip) apply(chip.dataset.themeId);       /* live preview, not a commit */
});

/* ENTER is the one write. Home reads the same localStorage key at head time,
   so the choice is already applied by the time the next document paints. */
document.querySelector('[data-enter]').addEventListener('click', () => {
  Theme.save(pick);
  location.href = 'home.html';
});
</script>
</body>
</html>
