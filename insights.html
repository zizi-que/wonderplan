<!DOCTYPE html>
<!--
  Insights — real screen. Visual truth: Figma Insights section 25:557, read via
  figwright 2026-07-26. Every padding / gap / size / radius / stroke below is a
  literal auto-layout value from a frame read, never an estimate, never a
  screenshot measurement.

  Frames read (all five):
    01. Zero                          74:2911
    02. active-cards                  74:3015
    02a. active-cards-all-time-open   84:3794
    02b. active-cards-early-open      84:4214
    03. active-graphs                 74:3069
  Plus the authored card variants, because a board instance can be a stale
  placement while the component is the design:
    cards / category=insights, type=yearly-expanded   76:2860
    cards / category=insights, type=all time-expanded 84:3744
    Graphs (6 variants: line|bar × 3-year|5-year|all-time)  77:2592

  Frame logic (Active Frame 375×726, Footer 85.802238, page 375×812):
    01 Zero    pad 20             gap 40  primary CENTER  counter CENTER
    Cards      pad 32/20/20/20    gap 16  primary MIN     counter CENTER
    Graph      pad 32/20/20/20    gap 16  primary MIN     counter CENTER
  Content column is 335 (375 − 20 − 20) everywhere.

  The five DVC translation laws (specs/DVC-BUILD.md) are applied throughout:
   1. Figma rules are ZERO-height lines with centre-aligned strokes — drawn
      here with a centred ::after so they cost 0 layout. A border-top would
      push everything below down by 1.5px, compounding per rule.
   2. strokeAlign INSIDE → inset rings, never CSS borders on auto-height
      boxes. (Insights has no stroked boxes; the footer's border-top sits on
      a fixed-height element, so it is safe.)
   3. Text heights are pinned to Figma's cap boxes. `text-box: trim-both cap
      alphabetic` makes an element's box equal Figma's, and every height the
      board pins is written out (Bold 23/145% → 17, SemiBold 15/120% → 11,
      Regular 12/120% → 9, SemiBold 19/135% → 14, SemiBold 17/120% → 12).
   4. Children sit at their drawn width inside their track, not stretched.
   5. A deduped instance can hide an override — the boards were also exported
      as PNG and looked at (that is how the Zero copy block and the graph
      geometry were confirmed).

  Vector assets are exact Figma SVG exports (the sanctioned export under the
  Token Economy rule): the Zero hero rising-graph, the three snack marks, the
  `equal` glyph, the disclosure chevron, and the graph axis with its two
  arrowheads. Nothing is hand-drawn or approximated.

  BOARD DEVIATIONS — three, each one deliberate and reported to the design director:
   A. `03. active-graphs` still carries the churro milestone icons on the
      accumulative points, and translucent ghost segments in the Per Year
      bars. Both were CUT by the design director on 2026-07-20 and are frozen in Project
      Memory ("Graph view plots actuals only — no forecast ghost in either
      graph"; snack icons removed, plain $ labels). Project Memory frozen
      decisions outrank the board, and this frame was unreadable on the REST
      limit when that sync happened, so it never caught up. Built per the
      frozen decision; frame needs the amendment.
   B. `02b. active-cards-early-open` opens a year using an `all time-expanded`
      instance — its inner tiles still read Most Days / Most Trips / Largest
      Burn and the pill still says "Tap to hide all time details". The
      authored `yearly-expanded` component (76:2860) is the real design and
      says Actual spend / Forecasted / Variance, "Tap to hide trip details".
      Built from the component; the frame placement needs swapping.
   C. There is no Cards↔Graph control drawn on ANY board, and `headers /
      header-insights` has no slot for one. Spec §4 calls for a segmented
      control top-right. Nothing was invented here — the Graph view is
      reached with ?view=graph until the design director designs the control.

  Insights WRITES NOTHING. It is a pure reader (repository philosophy);
  the only storage call anywhere in this file is a read.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>WonderPlan — Insights</title>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<!-- iOS is the platform this matters on. Safari evicts IndexedDB after 7 days
     without a visit, and a Home Screen app is exempt — so these tags are not
     polish, they are what stops a tester losing their ledger by not opening
     the app for a week. `apple-mobile-web-app-capable` is still required:
     iOS only began honouring the manifest's display mode in 16.4. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="WonderPlan" />
<meta name="theme-color" content="#DE2C47" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<!-- classic + blocking on purpose: sets <html data-theme> before first paint -->
<script src="js/theme.js"></script>
<style>
/* ══ Theme tokens live in css/theme.css — ONE copy for all five screens ══ */

/* ══ Structural tokens — Figma variables, values verified in the frame reads ══ */
:root {
  --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* One fixed value across all 16 themes (PALETTE-CONTRACT §, the design director
     2026-07-18): grey is the voice of "that's a shame", not a warning. The
     board binds Variance and Largest Burn to it, which is consistent with
     "the user is never colour-punished for overspending". */
  --attention: #757575;                /* color/attention */

  --surface-overlay: #FFFFFF8C;        /* color/Surface-Overlay — disclosure pill */
  --radius-chip: 7px;                  /* radius/chip — stat-tiles AND the
                                          disclosure pill (the design director 2026-07-26:
                                          pill rebound radius/compact-card 12 →
                                          radius/chip 7 to match the white
                                          stat-tiles; board already updated) */
  --radius-strip: 6px;                 /* radius/strip — category bar tops */
  --space-1: 8px; --space-2: 12px; --space-3: 16px; --space-4: 24px;
  --border-strong: 1.5px;              /* border/strong — Rule + graph axis */
  --footer-h: 85.802238px;
  --shadow-card: 0 1px 3px rgba(30,30,30,0.10);
  --col: 335px;                        /* content column */

  /* Insights category group — an INDEPENDENT variable set that stays
     identical across all 16 themes (frozen). Values are read from
     the Figma variables `insight-cat/*`, which the design director has since authored and
     bound; they SUPERSEDE the placeholder table in INSIGHTS-SPEC §3.
     These are identity colours, never semantic feedback. */
  --cat-transportation: #E34B62;       /* insight-cat/transportation 76:2515 */
  --cat-lodging:        #8AC0E5;       /* insight-cat/lodging        76:2516 */
  --cat-food:           #0A64A5;       /* insight-cat/food           76:2517 */
  --cat-activity:       #FFEB94;       /* insight-cat/activity       76:2521 */
  --cat-gifts:          #FFCA35;       /* insight-cat/gifts          76:2519 */
  /* Label ink per category, exactly as bound on `graph bar-detail`: white on
     the two dark grounds, ink on the three light ones. */
  --on-transportation: var(--on-primary);
  --on-lodging:        var(--ink);
  --on-food:           var(--on-primary);
  --on-activity:       var(--ink);
  --on-gifts:          var(--ink);
}

/* ══ Base ══ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
/* ══ The app frame (the design director, 2026-07-27) ══════════════════════════════════
   The five screens used to disagree above 375px: Home and Trips pinned their
   content left (states positioned at literal board coordinates), while Spend,
   DVC and Insights centred theirs. the design director chose centred for all.

   The whole frame is capped and centred — content AND footer together — so a
   wide window shows one phone-width column, not a narrow column sitting on a
   full-width bar. html carries the page colour so the margins match.

   At 375 and below this is completely inert, which is why it changes no
   audited pixel: 375 is the drawn width and the QA viewport.

   Home and Trips keep literal board coordinates INSIDE the frame — those are
   the drawn Figma values, and re-expressing them as flex gaps would mean
   inventing spacing nobody drew. Centring the frame achieves the chosen
   behaviour without touching them. */
html { background: var(--bg); }
body { font-family: var(--font); background: var(--bg); color: var(--ink);
  width: 100%;
  display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; background: none; border: 0; cursor: pointer; color: inherit;
  text-align: inherit; display: block; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
/* Figma cap-height vertical trim — makes element heights equal Figma's boxes */
.txt { text-box: trim-both cap alphabetic; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ══ Text styles — Figma text styles, verbatim (height = the pinned cap box) ══ */
.t-h1   { font-weight: 700; font-size: 23px; line-height: 145%; min-height: 17px; }
.t-h3   { font-weight: 600; font-size: 19px; line-height: 135%; min-height: 14px; }
.t-17   { font-weight: 600; font-size: 17px; line-height: 120%; min-height: 12px; }
.t-15b  { font-weight: 600; font-size: 15px; line-height: 120%; min-height: 11px; }
.t-13b  { font-weight: 600; font-size: 13px; line-height: 120%; min-height: 9px; }
.t-12   { font-weight: 400; font-size: 12px; line-height: 120%; min-height: 9px; }
.t-9b   { font-weight: 700; font-size:  9px; line-height: 120%; }
.t-13   { font-weight: 600; font-size: 13px; line-height: 120%; }  /* footer */

/* ══ Active Frame ══ */
/* The app column is 375 and the FOOTER BAND is not (the design director 2026-08-01,
   option 1). The constraint used to sit on `body`, so the white band ended
   with the app: at any window wider than 375 the column centred and theme
   background showed on BOTH sides of the band, which read as the footer
   stopping short. The column now lives on `main`, and `body` is free to be as
   wide as the window — so the band spans it while the five 75px tabs stay
   centred on 375 by the footer's own `justify-content: center`.
   Nothing drawn moves: `main` is the positioned ancestor on Home and Trips,
   so every absolute coordinate inside it is unchanged. */
/* overflow-x restored 2026-08-01. Moving the 375 column from `body` to `main`
   also moved the CLIP: `body { overflow: hidden }` used to crop everything to
   375, and with `body` now as wide as the window that guard was silently gone,
   so anything overflowing this column could paint into the side gutters.
   `clip`, not `hidden`, because these mains scroll vertically and `hidden`
   would make this box a scroll container on both axes. */
main { flex: 1; min-height: 0; overflow-x: clip; display: flex; flex-direction: column;
  width: 100%; max-width: 375px; margin-inline: auto; }
.state { display: none; flex: 1; min-height: 0; flex-direction: column; align-items: center; }
.state.on { display: flex; }
.frame-zero  { padding: 20px;          gap: 40px; justify-content: center; }
.frame-page  { padding: 32px 20px 20px; gap: 16px; }
.state > * { width: var(--col); flex: none; }

/* ══ 01. Zero ══
   icon-graph is a 175×209 layout box whose art overflows on every side
   (clipsContent false): children span local (−11.96,−7.47)…(208.28,209.32),
   so the export is 221×217 and is offset back onto the box. */
.zero-icon { width: 175px; height: 209px; position: relative; }
.zero-icon svg { position: absolute; left: -11.961481px; top: -7.470641px; }
/* --primary-text: see index.html — option A (the design director, 2026-07-28). */
.zero-copy { width: 335px; text-align: center; color: var(--primary-text);
  font-weight: 600; font-size: 19px; line-height: 135%; min-height: 40px; }

/* ══ headers / header-insights (335 × 33) ══ */
.header-insights { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.text-row { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }

/* ══ Rule / primary ══
   Figma rules are ZERO-height lines with a centre-aligned stroke: they must
   contribute 0 to layout, or every element below drifts down by 1.5px. */
.rule { width: 100%; height: 0; position: relative; }
.rule::after { content: ""; position: absolute; left: 0; right: 0;
  top: calc(var(--border-strong) / -2); height: var(--border-strong); background: var(--primary); }

/* ══ Cards view — Content (335 × 625, FILL/FIXED, gap 16) ══
   The board makes the YEAR LIST the scroll region, not the page: Content is a
   fixed-height column and `scroll container` absorbs the change when a card
   expands. Translated as flex-shrink on the list so the layout stays inside
   625 instead of overflowing the frame the way Figma does. */
.content { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  gap: 16px; align-items: stretch; width: 100%; }
.block-top { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.scroll { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 16px; align-items: stretch;
  /* a classic scrollbar would eat the 335 column; the board has none */
  scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ══ cards · category=insights · type=overview  (the snack card, 318 × 106.71) ══ */
.card-snacks { display: flex; align-items: center; justify-content: center;
  padding: 8px 0; align-self: center; }
.snack { width: 90px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.snack-figures { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.snack-count { color: var(--ink); }
.snack-label { color: var(--ink); }
.equal { width: 24px; height: 18px; flex: none; display: block; }

/* ══ cards · category=insights · type="all time" | "yearly" ══
   Both are `data trend` + a disclosure pill, VERTICAL gap 4. */
.card { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.data-trend { display: flex; align-items: center; gap: 8px; width: 100%;
  filter: drop-shadow(0 1px 3px rgba(30,30,30,0.10)); }
.stat-tile { border-radius: var(--radius-chip); background: var(--surface); }

/* all time — two equal tiles, label over value, both centred */
.tile-stack { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px; }
.tile-stack .label { text-align: center; color: var(--ink); }
.tile-stack .value { text-align: center; }

/* yearly — year tile is FIXED 200, trips tile FILLs; both are
   SPACE_BETWEEN with the two texts sitting on the tile's BOTTOM edge */
.tile-row { display: flex; align-items: flex-end; justify-content: space-between;
  gap: 8px; padding: 8px 24px; }
.tile-row.year { width: 200px; flex: none; }
.tile-row.count { flex: 1; }
.tile-row .label { text-align: center; color: var(--ink); }
.tile-row .value { text-align: center; }
/* Grid children sit at their DRAWN width, not stretched (law 4): the year
   label is a 37px box inside the 200px tile. */
.tile-row.year .label { width: 37px; flex: none; }

.v-accent { color: var(--accent); }
.v-muted  { color: var(--muted); }
.v-dvc    { color: var(--dvc-primary); }
.v-attn   { color: var(--attention); }

/* ══ trip insight-closed / -expanded — the disclosure pill ══ */
.pill { width: 100%; padding: 4px 12px 0; border-radius: var(--radius-chip);
  background: var(--surface-overlay); overflow: hidden;
  display: flex; flex-direction: column; gap: 4px; align-items: center; }
.disclose { width: 100%; height: 11px; padding: 0 1px; display: flex;
  align-items: center; gap: 8px; color: var(--ink); }
/* 311x11 with 116 / 67px of clear space — 44 tall, drawn row unmoved
   (the design director 2026-08-01). The view dots below already carry their own ::after
   (40x40 at a 40px gap) and are deliberately left alone. */
.disclose { position: relative; }
.disclose::after { content: ''; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); width: 100%; height: 44px; }
/* `arrows / menu pull down` is a DOWN triangle; the collapsed variant carries
   Figma rotation 90 (counter-clockwise) → the apex points RIGHT, so CSS needs
   −90deg. Expanded is rotation 0, i.e. the glyph as drawn. */
.chev { width: 11px; height: 11px; flex: none; display: block; transform: rotate(-90deg);
  transition: transform .15s ease; }
[data-open="true"] .chev { transform: rotate(0deg); }
.disclose .cap { height: 9px; }

/* `graph bar` and `graph bar-detail` are 335 FIXED inside the pill's 311
   content box: wider than their parent, and the pill is counter-axis CENTER,
   so they overflow symmetrically and land at x=0 — flush with the card edge,
   clipped by the pill's 7px radius.
   The centred overflow IS the whole mechanism. An extra negative margin
   double-counts it: flexbox resolves the margin first, so the bar ends up
   half the margin (6px) LEFT of the card edge. Width only. */
.bleed { width: calc(100% + 24px); flex: none; }
.mixbar { height: 6px; display: flex; overflow: hidden; }
.mixbar > i { display: block; height: 100%; }
/* booked-future ghost — same bar, ~50% translucency (PALETTE-CONTRACT L3) */
.mixbar > i.ghost { background: var(--muted); opacity: .5; }

/* ══ graph bar-detail — the vertical category chart (335 × 100) ══ */
.catbars { height: 100px; display: grid; grid-template-columns: repeat(5, 1fr);
  align-items: end; overflow: hidden; }
.catbar { position: relative; display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 4px; border-radius: var(--radius-strip) var(--radius-strip) 0 0; }
.catbar span { height: 17px; text-align: center; white-space: pre; }
/* A label that cannot fit ON its bar moves OFF it (the design director, 2026-07-28), rather
   than sitting half on the bar and half on the page ground — which is what
   produced the app's worst contrast reading, 1.14:1, since one ink cannot
   serve two grounds at once. Threshold is the label's own height plus the
   base padding twice; see `catbars()` for the derivation. */
.catbar--outside > span { position: absolute; left: 0; right: 0;
  bottom: 100%; margin-bottom: 4px; }

/* ══ cards · category=trips · type=overview — inside an expanded card ══ */
.trip-card { width: 100%; padding-top: 4px; display: flex; flex-direction: column; gap: 8px; }
/* The board draws these two texts as FIXED 309 boxes inside the 311 column. */
.trip-head { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.trip-head > * { width: 309px; color: var(--ink); }
.trip-tiles { width: 100%; display: flex; align-items: center; gap: 8px; }
.trip-tiles .stat-tile { flex: 1; display: flex; flex-direction: column; gap: 8px;
  padding: 8px; box-shadow: var(--shadow-card); }
/* the all-time superlative tile is padded 4/8/6/8, not 8 all round */
.super-tiles .stat-tile { padding: 4px 8px 6px; }
.trip-tiles .label { text-align: center; color: var(--ink); }
.trip-tiles .value { text-align: center; }
/* superlative value = year (SemiBold 19/135%) over metric (SemiBold 13/120%) */
.super { height: 30px; display: flex; flex-direction: column; align-items: stretch;
  justify-content: space-between; }
.super > * { text-align: center; }
.super .yr { font-weight: 600; font-size: 19px; line-height: 135%; height: 14px; }
.super .mt { font-weight: 600; font-size: 13px; line-height: 120%; height: 9px; }

/* ══ Graph view ══ */
.graph-scroll { flex: 1 1 0; min-height: 0; width: 100%; overflow-y: auto;
  overflow-x: hidden; display: flex; flex-direction: column; gap: 16px;
  align-items: center; scrollbar-width: none; }
.graph-scroll::-webkit-scrollbar { display: none; }
.graph-block { width: 100%; flex: none; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.graph-block.accumulative { padding-bottom: 12px; }
.graph { width: 100%; display: flex; flex-direction: column; gap: 6px; }
/* the line graph's H3 row is drawn FIXED 14, the bar graph's HUG 12 */
.graph.line .range-label { height: 14px; }
.graph.bar  .range-label { height: 12px; }
.range-label { display: flex; align-items: flex-start; justify-content: center; }
.plot { width: 335px; height: 235px; position: relative; }
.plot svg { position: absolute; inset: 0; overflow: visible; }
.plot .axis { color: var(--primary); }
.dots { height: 10px; display: flex; align-items: center;
  justify-content: center; gap: 40px; }
.dots.range { width: 110px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary);
  opacity: .5; display: block; }
.dots i.on { opacity: 1; }
/* A 10px dot is a 10px tap target. The ::after grows the touch area to 40px
   at ZERO layout cost, so the drawn geometry is untouched. */
.dots button { position: relative; }
.dots button::after { content: ""; position: absolute; inset: -15px; }

/* ══ view dots — the Cards ⇄ Graph swap (the design director 2026-07-26) ══
   Same architecture as the graph range pages: 10px dots, 40px apart, active
   at full opacity and inactive at 0.5. Rendered in --accent so the view
   switch reads as a different class of control from a graph's range pages,
   which stay --primary. (--attention was the first pick and was corrected
   2026-07-26: it is reserved for system failures and destructive confirms,
   and persistent chrome is neither.) Pinned at the foot of the Active Frame,
   above the footer nav, so it is reachable from any scroll position.
   NOT ON THE BOARD YET — supersedes the "segmented control top-right" that
   INSIGHTS-SPEC §4 called for and that was drawn nowhere. */
.view-dots { width: 60px; flex: none; align-self: center; }
.view-dots i { background: var(--accent); }

/* ══ Footer · variant Insights ══ */
footer.footer { flex: none; height: var(--footer-h); background: var(--surface);
  border-top: 1.900338px solid var(--deco); display: flex; justify-content: center; }
.tab { position: relative; width: 75px; height: 83.901894px;
  display: block; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; border-radius: 8px; }
.tab .label { position: absolute; top: 60px; left: 0; right: 0; text-align: center; color: var(--ink); }
.tab.on .label { color: var(--primary); }
.tab svg { position: absolute; }

@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
/* ══ iOS safe areas (the design director, 2026-08-02) ═══════════════════════════════════
   Reported on the live beta: a yellow strip under the footer, on every
   screen. Without `viewport-fit=cover` Safari keeps the layout OUT of the
   safe areas and paints them with the html background — which is the theme
   colour, so the home-indicator band read as the footer stopping short.
   Cover hands the layout those bands; `padding-top` on body puts the
   content back exactly where it sat before, and the footer's own white now
   reaches the physical bottom edge. Nothing drawn moves — where there is no
   inset (every desktop browser, and any phone without an indicator) both
   values resolve to 0, so this is inert off iOS. */
body { padding-top: env(safe-area-inset-top, 0px); }
footer.footer {
  height: calc(var(--footer-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
</style>
</head>
<body>

<main>
  <!-- ══════ 01. Zero ══════ -->
  <section class="state frame-zero" data-state="zero">

/* snack marks — exact Figma exports of the three `icons` components, stored
   once as viewBox + paths so the Hero card and the graph points share one
   copy. Fills that Figma binds to a variable use the token; the rest are the
   literal hex the component carries. The export's clip-path wrapper is
   dropped: the art is authored inside the viewBox, so it never clipped
   anything, and duplicate clip ids in one document are invalid. */
const SNACK_ART = {
  'mickey-ice-bar': { vb: '0 0 17 24', paths:

  'dole-whip': { vb: '0 0 22 24', paths:
    `<path d="M9 0H13V1.84615H16V3.69231H18V6.46154H20V10.1538H22V13.8462H18V24H4V13.8462H0V10.1538H2V6.46154H4V3.69231H6V1.84615H9V0Z" fill="var(--ink)"/><path d="M9 1.84619H13V3.69235H16V6.46158H18V9.23081H20V12H2V9.23081H4V6.46158H6V3.69235H9V1.84619Z" fill="#FFF6CF"/><path d="M10 3.69226H14V5.53841H16V7.38457H18V9.23072H4V7.38457H7V5.53841H10V3.69226Z" fill="#FFCA35"/><path d="M6 8.30774H19V11.077H3V9.23082H6V8.30774Z" fill="#FFF6CF"/><path d="M6 13.8462H16V22.1539H6V13.8462Z" fill="#C68D00"/><path d="M8 15.6923H10V20.3076H8V15.6923Z" fill="var(--surface)"/><path d="M4 13.8462H18V15.6923H4V13.8462ZM5 22.1539H17V24H5V22.1539Z" fill="var(--ink)"/>` },
  'churro': { vb: '0 0 18 24', paths:
    `<path d="M11 0H16V3.69231H18V9.23077H16V13.8462H14V18.4615H12V24H5V18.4615H7V13.8462H9V9.23077H11V0Z" fill="var(--ink)"/><path d="M13 1.84619H15V5.5385H16V8.30773H14V12.9231H12V17.5385H10V22.1539H7V17.5385H9V12.9231H11V8.30773H13V1.84619Z" fill="#B48500"/><path d="M14 2.76929H15V3.69236H14V2.76929ZM13 7.38467H14V8.30775H13V7.38467ZM11 12.9231H12V13.8462H11V12.9231ZM9 17.5385H10V18.4616H9V17.5385Z" fill="#FFF6CF"/><path d="M0 13.8462H10V24H0V13.8462Z" fill="var(--ink)"/><path d="M2 15.6923H8V22.1538H2V15.6923Z" fill="var(--surface)"/><path d="M2 17.5385H8V20.3077H2V17.5385Z" fill="#DE2C47"/>` },
};
// Hero card sizes are the board's own per-snack boxes (uniform scale of each
// component). Graph points use one 23x32 slot for all three, so the art is
// fitted inside it rather than distorted to fill it.
const SNACK_CARD_SIZE = { 'mickey-ice-bar': [34.5, 48.71], 'dole-whip': [43.5, 47.45], 'churro': [36, 48] };
const snackSvg = (id, w, h, attrs = '') => {
  const a = SNACK_ART[id]; if (!a) return '';
  return `<svg ${attrs} width="${w}" height="${h}" viewBox="${a.vb}" fill="none"
    preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${a.paths}</svg>`;
};

/* Which snack marks which range — read off the board's three `Graphs` line
   variants (77:3446 / 77:3447 / 77:3448), not chosen here. */
const RANGE_SNACK = { '3Y': 'mickey-ice-bar', '5Y': 'dole-whip', ALL: 'churro' };

/* `equal` glyph between the snack columns (76:3357) */
const EQUAL = '<svg class="equal" width="24" height="18" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0 6.0106V0H24V6.0106H0ZM0 18V11.9894H24V18H0Z" fill="var(--accent)"/></svg>';

/* Sample trips / expenses / dues removed in chunk 5 (2026-07-27): this screen
   now reads real rows from js/storage/repo.js. Insights writes nothing —
   it is a presentation layer over the ledger (operating rule 2). */

/* An ISO DATE STRING, not a Date: deriveInsights does today.slice(0, 4), and
   passing it a Date throws. It lived in the sample block and must survive the
   block's removal. */
const TODAY = new Date().toISOString().slice(0, 10);

/* ══════════════════════ boot ══════════════════════ */
const q = new URLSearchParams(location.search);
let data = null, snacks = [], expandedYears = new Set(), allTimeOpen = false;
let view = q.get('view') === 'graph' ? 'graph' : 'cards';   // ?view= deep-links
let range = { acc: 'ALL', year: '3Y' };            // each graph owns its own
const VIEWS = ['cards', 'graph'];
const VIEW_LABEL = { cards: 'Cards view', graph: 'Graph view' };
const RANGES = ['3Y', '5Y', 'ALL'];
const RANGE_LABEL = { '3Y': 'Last 3 years', '5Y': 'Last 5 years', ALL: 'All Time' };

const j = url => fetch(url).then(r => r.ok ? r.json() : Promise.reject(url));

Promise.all([
  j('./data/snacks.json').catch(() => ({ snacks: [] })),
  Promise.all([
    j('./data/benchmarks.json'), j('./data/categorizer/fingerprints.json'),
    j('./data/dvc-canonical.json'), j('./data/categorizer/prefixes.json'),
  ]).catch(() => null),
]).then(async ([snackFile, forecastFiles]) => {
  snacks = snackFile.snacks ?? [];

  /* One definition of the bundle's shape, shared with Trips and Spend — the
     three screens each building their own is how they came to disagree. */
  const forecast = forecastFiles ? makeForecastBundle(forecastFiles) : null;

  /* ── real reads (chunk 5) ─────────────────────────────────────────────
     Insights is a PRESENTATION layer: it reads trips, expenses and DVC
     contracts and writes nothing (operating rule 2). deriveInsights already
     drops planning scenarios, so a plan group cannot double-count. */
  let trips = [], expenses = [], dues = [], segments = [], hotels = [];
  try {
    const repo = createRepo(await openIdb());
    trips = await repo.listTrips();
    expenses = await repo.listExpenses();
    /* Segments and hotels feed toForecastTrip: without them a trip forecasts
       SILENTLY LOW and does not flag itself partial (chunk 6). */
    segments = (await Promise.all(trips.map(t => repo.segmentsOf(t.id)))).flat();
    hotels = await repo.listHotels();

    /* Dues are DERIVED, never stored (frozen DVC principle): contract points
       x the published rate, for the years the contract's tracking window
       covers. This retires the honest `duesRows: []` stub.

       duesRowsFor() keys on `resort`; DVC contracts store the same value as
       `resort_hotel_id` (both are the 3-letter datasheet id), so the map is a
       rename, not a lookup.

       throughYear is THIS year, not the furthest booked trip: dues are a
       recorded annual cost, and generating them for a year that has not
       happened would put speculative money on a Year Card. Forecasting
       forward is chunk 6's job. */
    if (forecast) {
      const contracts = (await repo.listContracts())
        .map(c => ({ ...c, resort: c.resort_hotel_id }));
      dues = duesRowsFor(contracts, forecast.C, Number(TODAY.slice(0, 4)));
    }
  } catch (e) {
    /* No storage means an empty ledger, which renders the Zero state — the
       honest reading, and never a crash. */
    console.error('Insights: storage unavailable —', e);
  }

  /* dev harness: ?years=N keeps only the most recent N years, so the sparse /
     zero / 10-year shapes stay reachable for QA. It can only NARROW what
     storage holds; it never fabricates a year. */
  const nYears = q.get('years');
  if (nYears !== null) {
    const keep = new Set([...new Set(trips.map(t => String(t.start_date).slice(0, 4)))]
      .sort((a, b) => b - a).slice(0, Number(nYears)));
    trips = trips.filter(t => keep.has(String(t.start_date).slice(0, 4)));
    dues = dues.filter(d => keep.has(String(d.year)));
  }

  data = deriveInsights({ trips, expenses, duesRows: dues, segments, hotels,
                          forecast, today: TODAY });
  render();
});

function render() {
  const forced = q.get('state');
  const state = forced || (!data.hasData ? 'zero' : view);
  document.querySelectorAll('.state').forEach(s =>
    s.classList.toggle('on', s.dataset.state === state));
  // Zero has no data, so there is nothing to swap between — no view dots.
  if (state === 'zero') return;
  if (state === 'cards') { renderSnacks(); renderAllTime(); renderYears(); }
  if (state === 'graph') { renderAccumulative(); renderYearGraph(); }
  renderViewDots(state === 'graph' ? 'v-graph' : 'v-cards');
}

/* ══ view dots — Cards ⇄ Graph. The swap changes the LENS ONLY: the dataset
      is derived once on entry and both views read the same tree (frozen). ══ */
function renderViewDots(hostId) {
  const host = document.getElementById(hostId);
  host.innerHTML = '';
  VIEWS.forEach(v => {
    const b = el('button');
    b.type = 'button';
    b.style.cssText = 'padding:0; width:10px; height:10px; flex:none;';
    b.setAttribute('aria-label', VIEW_LABEL[v]);
    b.setAttribute('aria-pressed', String(v === view));
    const dot = el('i'); if (v === view) dot.classList.add('on');
    b.append(dot);
    b.addEventListener('click', () => { if (v !== view) { view = v; render(); } });
    host.append(b);
  });
}

/* ══ cards / insights, overview — snack comparison ══ */
function renderSnacks() {
  const host = $('#snacks');
  host.innerHTML = '';
  // A missing/null price omits that snack rather than printing Infinity;
  // all three missing omits the whole line (INSIGHTS-BUILD §5.2).
  const usable = snacks.filter(s => Number(s.price) > 0);
  if (!usable.length) return;
  usable.forEach((s, i) => {
    if (i) host.insertAdjacentHTML('beforeend', EQUAL);
    const col = el('div', 'snack');
    const [w, h] = SNACK_CARD_SIZE[s.id] ?? [36, 48];
    col.insertAdjacentHTML('beforeend', snackSvg(s.id, w, h));
    const figs = el('div', 'snack-figures');
    const n = Math.round(data.allTime.total / s.price);
    figs.append(el('div', 'snack-count t-h1 txt', String(n)));
    figs.append(el('div', 'snack-label t-12 txt', n === 1 ? s.label_singular : s.label));
    col.append(figs);
    host.append(col);
  });
}

/* ══ cards / insights, "all time" ⇄ "all time-expanded" ══ */

/* ══ scroll container — one card per calendar year, newest first ══ */
function renderYears() {
  const host = $('#years');
  host.innerHTML = '';
  data.years.forEach(y => {
    const open = expandedYears.has(y.year);
    const card = el('article', 'card');
    card.dataset.open = String(open);

    const trend = el('div', 'data-trend');
    // year tile is FIXED 200 with the label pinned to its drawn 37px box
    const yr = el('div', 'stat-tile tile-row year');
    yr.append(el('div', 'label t-15b txt', String(y.year)));
    yr.append(el('div', 'value t-h1 txt v-accent', money(y.total)));
    // trips tile FILLs; value first, then the counted noun — a dues-only year
    // reads "0 trips", never hidden.
    const ct = el('div', 'stat-tile tile-row count');
    ct.append(el('div', 'value t-h1 txt v-muted', String(y.tripCount)));
    ct.append(el('div', 'label t-15b txt', plural(y.tripCount, 'trip').replace(/^\d+\s/, '')));
    trend.append(yr, ct);
    card.append(trend);

    const pill = el('div', 'pill');
    pill.append(discloseButton(
      open ? 'Tap to hide trip details' : 'Tap to see trip details',
      () => { open ? expandedYears.delete(y.year) : expandedYears.add(y.year);
              renderYears(); }));

    if (!open) {
      pill.append(mixbar(y.byCategory, y.ghost));
    } else {
      y.trips.forEach(t => pill.append(tripCard(t)));
      pill.append(catbars(y.byCategory));
    }
    card.append(pill);
    host.append(card);

/* ══ cards / trips, overview — one trip inside an expanded year ══ */
function tripCard(t) {
  const wrap = el('div', 'trip-card');
  const head = el('div', 'trip-head');
  head.append(el('div', 't-17 txt', t.name));
  head.append(el('div', 't-13b txt', `from ${usDate(t.start_date)} to ${usDate(t.end_date)}`));
  wrap.append(head);

  const row = el('div', 'trip-tiles');
  // A partial forecast renders "—" for BOTH Forecasted and Variance. A
  // partial forecast is not a smaller forecast; printing its number would be
  // exactly the fake number the engine exists to avoid.
  row.append(tripTile('Actual spend', money(t.actual), 'v-accent'));
  row.append(tripTile('Forecasted', t.forecasted == null ? '—' : money(t.forecasted), 'v-dvc'));
  row.append(tripTile('Variance', t.variance == null ? '—' : `${t.variance}%`, 'v-attn'));
  wrap.append(row);
  return wrap;
}

function tripTile(label, value, cls) {
  const tile = el('div', 'stat-tile');
  tile.append(el('div', 'label t-12 txt', label));
  tile.append(el('div', `value t-h3 txt ${cls}`, value));
  return tile;
}

function superTile(label, crown, fmt, cls) {
  const tile = el('div', 'stat-tile');
  tile.append(el('div', 'label t-12 txt', label));
  const v = el('div', `value super ${cls}`);
  // YEAR-scoped, always: a year above the metric, never a trip name.
  v.append(el('div', 'yr txt', crown ? String(crown.year) : '—'));
  v.append(el('div', 'mt txt', crown ? fmt(crown) : '—'));
  tile.append(v);
  return tile;
}

function statStack(label, value, cls) {
  const tile = el('div', 'stat-tile tile-stack');
  tile.append(el('div', 'label t-15b txt', label));
  tile.append(el('div', `value t-h1 txt ${cls}`, value));
  return tile;
}

function discloseButton(caption, onClick) {
  const b = el('button', 'disclose');
  b.type = 'button';
  b.setAttribute('aria-expanded', String(caption.startsWith('Tap to hide')));
  b.insertAdjacentHTML('beforeend', CHEV);

/* ══ graph bar — the collapsed horizontal mix bar (proportions) ══
   Uncategorized counts toward the year total but is NEVER a sixth segment,
   so the bar may not sum to the total. That is correct and intentional. */
function mixbar(mix, ghost = 0) {
  const bar = el('div', 'bleed mixbar');
  const spent = CATEGORIES.reduce((s, c) => s + mix[c], 0);
  const sum = spent + ghost;
  CATEGORIES.forEach(c => {
    const i = el('i');
    // A year with nothing logged yet (a booked trip, no expenses) collapses
    // to an empty strip. An even five-way split would claim a spending shape
    // that does not exist — the same fake-number failure as a partial
    // forecast printing its number.
    i.style.width = sum > 0 ? `${(mix[c] / sum) * 100}%` : '0%';
    i.style.background = `var(--cat-${c})`;
    bar.append(i);
  });
  // Booked-future ghost — money committed to a booked trip but not yet spent.
  // ONE trailing segment, not a five-way split: `budget_amount` carries no
  // category, so splitting it would invent a breakdown that does not exist
  // ("never invent fake numbers", same spec line). Neutral --muted at 50% so
  // it claims no category. Year mix bars only.
  if (ghost > 0) {
    const g = el('i', 'ghost');
    g.style.width = `${(ghost / sum) * 100}%`;
    bar.append(g);
  }
  bar.setAttribute('role', 'img');
  bar.setAttribute('aria-label', 'Category mix: ' + CATEGORIES
    .map(c => `${LABEL[c]} ${money(mix[c])}`).join(', ')
    + (ghost > 0 ? `; ${money(ghost)} booked but not yet spent` : ''));
  return bar;
}

/* ══ graph bar-detail — the expanded vertical category chart ══
   This is the accessibility affordance: colour is never the only signal, so
   every segment is named AND priced ("$450 Travel"). */
/* The threshold is MEASURED from the real CSS, once, rather than restated as
   17 + 4*2 here — restyling the label would otherwise silently desync the
   rule from the thing it measures. Measured off a probe attached to the
   document, because a detached node has no computed style at all. */
let _catbarThreshold = null;
function catbarLabelThreshold() {
  if (_catbarThreshold != null) return _catbarThreshold;
  const host = el('div', 'bleed catbars'), bar = el('div', 'catbar');
  bar.append(el('span', 't-9b txt', 'x'));
  host.append(bar);
  host.style.cssText = 'position:absolute; visibility:hidden; pointer-events:none';
  document.body.append(host);
  _catbarThreshold = parseFloat(getComputedStyle(bar.firstChild).height)
    + parseFloat(getComputedStyle(bar).paddingBottom) * 2;
  host.remove();
  return _catbarThreshold;
}

function catbars(mix) {
  const host = el('div', 'bleed catbars');
  const max = Math.max(...CATEGORIES.map(c => mix[c]), 0);
  CATEGORIES.forEach(c => {
    const bar = el('div', 'catbar');
    const h = max > 0 ? Math.max((mix[c] / max) * 100, 0) : 0;
    bar.style.height = `${h}px`;
    bar.style.background = `var(--cat-${c})`;
    // Conditional placement (the design director, 2026-07-28): the label moves OFF the bar
    // when the net bar height cannot hold it — its own 17px plus the base
    // 4px padding at top and bottom, so 25px. Both numbers are read from the
    // CSS above rather than restated, so restyling the label cannot silently
    // desync the threshold from the thing it measures.
    //
    // The previous rule kept the label ON the bar below 21px and only swapped
    // the ink. That is what produced the app's worst contrast reading: a
    // 10px bar leaves the 17px label straddling the bar edge, so whichever
    // ink is chosen, half the glyphs land on the wrong ground — --ink on
    // food blue measures 1.17:1. One ink cannot serve two grounds; moving the
    // label off gives it a single, known ground.
    const fits = h >= catbarLabelThreshold();
    bar.classList.toggle('catbar--outside', !fits);
    // On the bar: the board's own per-category ink. Off it: --ink on --bg,
    // which is the page's normal body pairing and clears AA everywhere.
    bar.style.color = fits ? `var(--on-${c})` : 'var(--ink)';
    bar.append(el('span', 't-9b txt', `${money(mix[c])}\n${LABEL[c]}`));
    host.append(bar);
  });
  return host;
}

/* ══════════════════════ Graph view ══════════════════════
   Hand-rolled inline SVG — no charting library (no-build vanilla project).
   Both graphs plot ACTUALS ONLY: no forecast ghost anywhere in Graph view
   (frozen 2026-07-20) — that half of the board still needs amending.
   The milestone snack icons, however, STAY: the design director confirmed 2026-07-26 that
   each range carries its OWN snack, which the board's three line variants
   already encode. An earlier record said the icons were cut; it was stale and
   is superseded.

   Plot geometry, all literal from the frame reads:
     plot          335 × 235
     axis          335 × 218.97 at the top of the plot
     year labels   16px band below the axis (12px Regular, bottom-aligned)
   Year label centres are evenly spaced with an outer margin of 5/12 of the
   step — the rule that reproduces BOTH drawn cases (5 years → 29…305 step
   69; 3 years → 49…285.5 step 118.25) to within 0.3px. */
const AXIS_H = 218.966, PLOT_W = 335, PLOT_H = 235, LABEL_BAND = 16;
const xsFor = n => {
  if (n <= 1) return [PLOT_W / 2];
  const step = PLOT_W / (n - 1 + 5 / 6);
  const x0 = (PLOT_W - step * (n - 1)) / 2;
  return Array.from({ length: n }, (_, i) => x0 + i * step);
};

function yearLabels(xs, years) {
  return years.map((y, i) =>
    `<text x="${xs[i].toFixed(2)}" y="${PLOT_H}" text-anchor="middle"
       font-family="Manrope" font-size="12" font-weight="400"
       fill="currentColor">${y}</text>`).join('');
}

function graphShell(hostId, cls, rangeKey, body, srTable) {
  const host = document.getElementById(hostId);
  host.innerHTML = '';
  const lab = el('div', 'range-label');
  lab.append(el('span', 't-17 txt', RANGE_LABEL[rangeKey]));
  host.append(lab);
  const plot = el('div', 'plot');
  // Data FIRST, axis LAST — the axis must paint in front of the graph
  // (the design director 2026-07-26). Bars sit on the baseline, so with the axis behind
  // them each bar punched a gap in the X axis and the bottom rule read as
  // broken. Painting the axis over the data keeps that line continuous.
  plot.insertAdjacentHTML('beforeend',
    `<svg width="${PLOT_W}" height="${PLOT_H}" viewBox="0 0 ${PLOT_W} ${PLOT_H}"
       xmlns="http://www.w3.org/2000/svg" role="img" style="color:var(--ink)"
       aria-label="${srTable.label}">${body}</svg>`);
  plot.insertAdjacentHTML('beforeend', AXIS);
  host.append(plot);
  const t = el('table', 'sr');
  t.innerHTML = srTable.html;
  host.append(t);
}

function renderDots(hostId, active, onPick) {
  const host = document.getElementById(hostId);
  host.innerHTML = '';
  RANGES.forEach(r => {
    const b = el('button');
    b.type = 'button';
    b.style.cssText = 'padding:0; width:10px; height:10px; flex:none;';
    b.setAttribute('aria-label', RANGE_LABEL[r]);
    b.setAttribute('aria-pressed', String(r === active));
    const dot = el('i'); if (r === active) dot.classList.add('on');
    b.append(dot);
    b.addEventListener('click', () => onPick(r));
    host.append(b);
  });
}

function renderAccumulative() {
  const years = data.ranges[range.acc];
  // Range-scoped: a 3Y page accumulates ONLY the last 3 years from zero, so
  // its right edge answers "what did the last 3 years cost". The lifetime
  // total appears on ALL alone (the design director 2026-07-26).
  const pts = data.cumulativeBy[range.acc];
  const xs = xsFor(pts.length);
  const max = Math.max(...pts.map(p => p.total), 1);
  // A point's $ label hangs 22px below its vertex (icon centre + 16 + gap 6)
  // and is 9px tall, so a zero-based mapping would drive a small first year's
  // label through the axis and into the year band. Both ends of the band are
  // therefore the board's own drawn extremes, converted to plot coordinates:
  // lowest vertex 174 (its label bottom then clears the axis line by the same
  // 14px the board draws), highest vertex 49.
  const Y_BASE = 174, Y_TOP = 49;
  const yOf = v => Y_BASE - (v / max) * (Y_BASE - Y_TOP);

  const line = pts.length > 1
    ? `<polyline fill="none" stroke="var(--primary)" stroke-width="1.5"
         points="${pts.map((p, i) => `${xs[i].toFixed(2)},${yOf(p.total).toFixed(2)}`).join(' ')}"/>`
    : '';
  // Point marker, exactly as the board draws it: a 50x47 `cards/graph point`
  // whose 23x32 snack icon is centred ON the vertex, with the $ label 6px
  // below it (icon bottom +16, gap 6 → label top at vertex+22). The snack is
  // per RANGE, not per point — 3Y Mickey Ice Bar, 5Y Dole Whip, ALL Churro,
  // read off the board's three line variants. The three components have
  // different aspect ratios, so the art is fitted inside the shared 23x32
  // slot (xMidYMid meet) rather than stretched to fill it.
  const snack = RANGE_SNACK[range.acc];
  const marks = pts.map((p, i) =>
    snackSvg(snack, 23, 32, `x="${(xs[i] - 11.5).toFixed(2)}" y="${(yOf(p.total) - 16).toFixed(2)}"`)
  ).join('');
  const labels = pts.map((p, i) =>
    `<text x="${xs[i].toFixed(2)}" y="${(yOf(p.total) + 22 + 9).toFixed(2)}"
       text-anchor="middle" font-family="Manrope" font-size="12"
       fill="currentColor">${kmoney(p.total)}</text>`).join('');

  graphShell('g-acc', 'line', range.acc, line + marks + labels + yearLabels(xs, years), {
    label: `Cumulative trip spending, ${RANGE_LABEL[range.acc]}: ` +
      pts.map(p => `${p.year} ${money(p.total)}`).join(', '),
    html: '<caption>Cumulative spending by year</caption><tr><th>Year</th><th>Cumulative</th></tr>' +
      pts.map(p => `<tr><td>${p.year}</td><td>${money(p.total)}</td></tr>`).join(''),
  });
  renderDots('d-acc', range.acc, r => { range.acc = r; renderAccumulative(); });
}

function renderYearGraph() {
  const years = data.ranges[range.year];
  const byYear = new Map(data.years.map(y => [y.year, y]));
  const rows = years.map(y => byYear.get(y)
    ?? { year: y, total: 0, byCategory: Object.fromEntries(CATEGORIES.map(c => [c, 0])) });
  const xs = xsFor(rows.length);
  const max = Math.max(...rows.map(r => CATEGORIES.reduce((s, c) => s + r.byCategory[c], 0)), 1);
  const band = AXIS_H - 8;                       // clear of the axis arrowhead
  const W = 16;                                  // bar width, drawn

  // Stacking order is bottom-up gifts → activity → food → lodging →
  // transportation (the mix-bar order reversed), exactly as the board's
  // rotated `graph` frames render.
  const stack = [...CATEGORIES].reverse();
  const bars = rows.map((r, i) => {
    const sum = CATEGORIES.reduce((s, c) => s + r.byCategory[c], 0);
    let y = AXIS_H;
    return stack.map(c => {
      const h = sum > 0 ? (r.byCategory[c] / max) * band : 0;
      if (h <= 0) return '';
      y -= h;
      return `<rect x="${(xs[i] - W / 2).toFixed(2)}" y="${y.toFixed(2)}"
        width="${W}" height="${h.toFixed(2)}" fill="var(--cat-${c})"/>`;
    }).join('');
  }).join('');

  graphShell('g-year', 'bar', range.year, bars + yearLabels(xs, years), {
    label: `Spending by category per year, ${RANGE_LABEL[range.year]}: ` +
      rows.map(r => `${r.year} ${money(CATEGORIES.reduce((s, c) => s + r.byCategory[c], 0))}`).join(', '),
    html: '<caption>Spending by category per year</caption><tr><th>Year</th>' +
      CATEGORIES.map(c => `<th>${LABEL[c]}</th>`).join('') + '</tr>' +
      rows.map(r => `<tr><td>${r.year}</td>` +
        CATEGORIES.map(c => `<td>${money(r.byCategory[c])}</td>`).join('') + '</tr>').join(''),
  });
  renderDots('d-year', range.year, r => { range.year = r; renderYearGraph(); });
}

/* ══ helpers ══ */
const usDate = iso => { const [y, m, d] = iso.split('-'); return `${m}/${d}/${y.slice(2)}`; };
// graph data labels are compact ("$10k") the way the board writes them;
// every other number in the tab is full dollars via money().
function kmoney(n) {
  if (n >= 1000) {
    const k = n / 1000;
    return `$${(k >= 10 ? Math.round(k) : Math.round(k * 10) / 10)}k`;
  }
  return money(n);
}
